name: Discover model

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: model-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: [self-hosted, agents]
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_REPO: ${{ github.repository }}
      MAINTAINED_MODEL_COUNT: 10
      AGENT_MODEL: ${{ vars.ONBOARD_AGENT_MODEL || 'Qwen/Qwen3.6-35B-A3B-FP8' }}
      CLOUDRIFT_INFERENCE_URL: ${{ vars.CLOUDRIFT_INFERENCE_URL || 'https://inference.cloudrift.ai/v1' }}
      AGENT_KEY_FILE: /tmp/emmy-discovery-agent-key-${{ github.run_id }}-${{ github.run_attempt }}
      AGENT_PROMPT: /tmp/emmy-discovery-prompt-${{ github.run_id }}-${{ github.run_attempt }}.md
      AGENT_MANIFEST: /tmp/emmy-discovery-manifest-${{ github.run_id }}-${{ github.run_attempt }}.json
      AGENT_TRANSCRIPT: /tmp/emmy-discovery-transcript-${{ github.run_id }}-${{ github.run_attempt }}.txt
      AGENT_INVENTORY: /tmp/emmy-discovery-inventory-${{ github.run_id }}-${{ github.run_attempt }}.json
      DISCOVERY_SUMMARY: /tmp/emmy-discovery-summary-${{ github.run_id }}-${{ github.run_attempt }}.md
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.EXPERIMENT_APP_ID }}
          private-key: ${{ secrets.EXPERIMENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Find rolling discovery pull request
        id: rolling
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          matches=$(gh pr list --state open --limit 100 \
            --json number,headRefName,isCrossRepository,labels \
            --jq '[.[] | select((.isCrossRepository | not) and (([.labels[].name] | index("model-discovery")) or (.headRefName | startswith("agents/model-discovery-")) or (.headRefName | startswith("agents/plan-onboard-"))))]')
          count=$(jq length <<< "$matches")
          if [ "$count" -gt 1 ]; then
            echo "Expected at most one rolling model discovery PR, found $count" >&2
            exit 1
          fi

          number=$(jq -r '.[0].number // empty' <<< "$matches")
          branch=$(jq -r '.[0].headRefName // empty' <<< "$matches")
          if [ -n "$number" ]; then
            echo "Updating rolling discovery PR #$number from $branch"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            mapfile -t orphan_branches < <(
              gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/agents/model-discovery-" \
                --jq '.[].ref | sub("^refs/heads/"; "")' | sort
            )
            if [ "${#orphan_branches[@]}" -gt 1 ]; then
              echo "Expected at most one unpaired model discovery branch, found ${#orphan_branches[@]}" >&2
              exit 1
            fi
            branch="${orphan_branches[0]:-}"
            if [ -n "$branch" ]; then
              echo "Adopting unpaired discovery branch $branch"
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout discovery branch
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.rolling.outputs.branch || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Emmy
        run: make setup-agent

      - name: Run discover-models agent
        env:
          CLOUDRIFT_API_KEY: ${{ secrets.CLOUDRIFT_API_KEY }}
        run: |
          ./venv/bin/python .github/scripts/discovery_lifecycle.py inventory > "$AGENT_INVENTORY"
          python3 - <<'PY'
          import os
          from pathlib import Path

          inventory = Path(os.environ["AGENT_INVENTORY"]).read_text()
          Path(os.environ["AGENT_PROMPT"]).write_text(f"""Use the discover-models skill read-only.

          Review the existing recipes and current demand for both supported and newly released open-weight models.
          Select exactly {os.environ['MAINTAINED_MODEL_COUNT']} existing, fully configured recipes for periodic
          testing and optimization. Prefer current community demand, serving value, architecture coverage, and a
          useful spread of model sizes. Classify every other complete recipe as best-effort or obsolete. Best-effort
          means the model remains useful and runnable, but is not selected for periodic optimization. Obsolete is a
          strict technical judgment: use it when a named all-around better replacement for the same task is available
          at a comparable or lower practical VRAM footprint, or a concrete technical limitation means the recipe
          should no longer be used. When naming a replacement, compare the qualified deployment targets in the
          recipes: its smallest target must use no more total physical GPU memory than the old recipe's smallest
          target. All-around means the old model has no material advantage in quality, context, supported hardware,
          latency or throughput, operating cost, modality, or licensing. A smaller or quantized recipe is not obsolete
          merely because a larger or unquantized recipe exists. If evidence is ambiguous or the model retains a useful
          advantage, use best-effort. Low demand, age, or exclusion from the maintained set is not sufficient. A
          previously obsolete recipe may become maintained or best-effort when the evidence changes. Never classify
          an onboarding/untested shell. The exhaustive compact repository inventory is included below; do not rebuild
          it or read individual recipes unless one entry needs closer inspection. Use at most six public-web tool
          calls total, including calls made in parallel, then write the manifest. Do not keep researching once every
          maintained choice and obsolete proposal has enough evidence for this conservative classification.

          <repository-inventory>
          {inventory}
          </repository-inventory>

          Give every maintained, best-effort, obsolete, and onboarding decision a concise evidence-backed rationale.
          For an obsolete recipe, name the superseding model in both replacement_model_id and the rationale, or omit
          replacement_model_id and explain the technical reason the recipe should be dropped when no successor is
          appropriate. Also select zero to three new models with no recipe. For each new model, propose one to three
          useful deployment setups using only canonical deploy.gpu and positive deploy.gpu_count values. These will
          become untested onboarding recipe shells. Keep at most three onboarding shells total: every existing
          onboarding/untested recipe consumes one slot, so select no new model when three already exist. Do not claim
          shells have been deployed or benchmarked. Do not edit the repository, rent hardware, or deploy anything.

          Before your final response, call write_file once with path {os.environ['AGENT_MANIFEST']} and content equal
          to exactly one JSON object without a Markdown fence:
          {{
            "maintained_models": [
              {{"model_id": "exact/org-model ID for an existing recipe", "rationale": "why it is maintained"}}
            ],
            "best_effort_models": [
              {{"model_id": "exact/org-model ID", "rationale": "why it remains useful on a best-effort basis"}}
            ],
            "obsolete_models": [
              {{"model_id": "org/old-model", "replacement_model_id": "org/better-model",
                "rationale": "name the replacement, compare qualified target VRAM, and explain why no advantage remains"}},
              {{"model_id": "org/drop-model", "rationale": "technical reason to drop it without a successor"}}
            ],
            "onboarding_models": [
              {{"model_id": "org/model", "task": "generate", "rationale": "why it is worth onboarding",
                "deployments": [
                  {{"deploy.gpu": "NVIDIA H200 141GB", "deploy.gpu_count": 1}}
                ]}}
            ]
          }}
          maintained_models must contain exactly {os.environ['MAINTAINED_MODEL_COUNT']} entries. Use task "embed" only
          for an embedding model. Use exact canonical GPU names from the repository hardware registry. Return an empty
          onboarding_models list when nothing new is suitable. The manifest file is required; do not edit any
          repository file. When the runner forces the write_file tool, write the best manifest supported by the
          evidence already gathered. After write_file succeeds, your final response may only confirm completion.
          """)
          PY
          printf '%s' "$CLOUDRIFT_API_KEY" > "$AGENT_KEY_FILE"
          chmod 600 "$AGENT_KEY_FILE"
          unset CLOUDRIFT_API_KEY
          set +e
          env -u CLOUDRIFT_API_KEY ./venv/bin/emmy agent run \
            --api-key-file "$AGENT_KEY_FILE" \
            --skill .claude/skills/discover-models/SKILL.md \
            --prompt "$AGENT_PROMPT" \
            --model "$AGENT_MODEL" \
            --output "$AGENT_TRANSCRIPT" \
            --max-turns 48 \
            --force-write-turn 16 \
            --max-output-tokens 4096 \
            --allow-write "$AGENT_MANIFEST"
          agent_status=$?
          set -e
          if [ "$agent_status" -ne 0 ] && [ ! -s "$AGENT_MANIFEST" ]; then
            exit "$agent_status"
          fi
          if [ "$agent_status" -ne 0 ]; then
            echo "Agent confirmation failed after the manifest was written; continuing to repository validation."
          fi

      - name: Verify discovery was read-only
        run: test -z "$(git status --porcelain)"

      - name: Validate and apply model lifecycle
        id: lifecycle
        run: |
          ./venv/bin/python .github/scripts/discovery_lifecycle.py \
            apply \
            --input "$AGENT_MANIFEST" \
            --maintained-count "$MAINTAINED_MODEL_COUNT" \
            --summary "$DISCOVERY_SUMMARY"
          git diff --check

      - name: Refresh GitHub App token
        if: steps.lifecycle.outputs.changed == 'true' || steps.rolling.outputs.exists == 'true'
        id: app-token-refresh
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.EXPERIMENT_APP_ID }}
          private-key: ${{ secrets.EXPERIMENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Configure GitHub CLI credentials
        if: steps.lifecycle.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token-refresh.outputs.token }}
        run: |
          git config user.name "emmy-onboarding-bot"
          git config user.email "emmy-onboarding-bot[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Commit and push rolling lifecycle update
        if: steps.lifecycle.outputs.changed == 'true'
        id: branch
        env:
          EXISTING_BRANCH: ${{ steps.rolling.outputs.branch }}
        run: |
          branch="$EXISTING_BRANCH"
          if [ -n "$branch" ]; then
            git switch -C "$branch"
          else
            branch="agents/model-discovery-${GITHUB_RUN_ID}"
            git switch -c "$branch"
          fi
          git add --all -- recipes plans
          git diff --cached --check
          git commit -m "recipes: refresh model lifecycle"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create or update rolling discovery pull request
        if: steps.lifecycle.outputs.changed == 'true' || steps.rolling.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token-refresh.outputs.token }}
          PR_NUMBER: ${{ steps.rolling.outputs.number }}
          PLAN_BRANCH: ${{ steps.branch.outputs.branch || steps.rolling.outputs.branch }}
        run: |
          gh label create model-discovery \
            --description "Automated model recipe lifecycle" \
            --color 5319E7 --force
          gh label create model-onboarding \
            --description "Automated model discovery and onboarding" \
            --color 1D76DB --force
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" \
              --title "Refresh model lifecycle and onboarding" \
              --body-file "$DISCOVERY_SUMMARY" \
              --add-label model-discovery \
              --add-label model-onboarding
          else
            gh pr create \
              --draft \
              --head "$PLAN_BRANCH" \
              --base "${{ github.event.repository.default_branch }}" \
              --title "Refresh model lifecycle and onboarding" \
              --body-file "$DISCOVERY_SUMMARY" \
              --label model-discovery \
              --label model-onboarding
          fi

      - name: Cleanup discovery credentials and output
        if: always()
        run: |
          rm -f \
            "$AGENT_PROMPT" \
            "$AGENT_MANIFEST" \
            "$AGENT_TRANSCRIPT" \
            "$AGENT_INVENTORY" \
            "$DISCOVERY_SUMMARY" \
            "$AGENT_KEY_FILE"
          git config --unset-all credential.helper || true
