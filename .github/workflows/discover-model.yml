name: Discover model

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      gpu:
        description: Exact GPU name from emmy/hardware.py
        required: false
        type: string
      gpu_count:
        description: Exact GPU count
        required: false
        type: number

concurrency:
  group: model-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: [self-hosted, agents]
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    env:
      TARGET_GPU: ${{ inputs.gpu || vars.DISCOVERY_TARGET_GPU || 'NVIDIA H200 141GB' }}
      TARGET_GPU_COUNT: ${{ inputs.gpu_count || vars.DISCOVERY_TARGET_GPU_COUNT || 1 }}
      MAINTAINED_MODEL_COUNT: 10
      AGENT_MODEL: ${{ vars.ONBOARD_AGENT_MODEL || 'Qwen/Qwen3.6-35B-A3B-FP8' }}
      CLOUDRIFT_INFERENCE_URL: ${{ vars.CLOUDRIFT_INFERENCE_URL || 'https://inference.cloudrift.ai/v1' }}
      AGENT_KEY_FILE: /tmp/emmy-discovery-agent-key-${{ github.run_id }}-${{ github.run_attempt }}
      AGENT_PROMPT: /tmp/emmy-discovery-prompt-${{ github.run_id }}-${{ github.run_attempt }}.md
      AGENT_MANIFEST: /tmp/emmy-discovery-manifest-${{ github.run_id }}-${{ github.run_attempt }}.json
      AGENT_TRANSCRIPT: /tmp/emmy-discovery-transcript-${{ github.run_id }}-${{ github.run_attempt }}.txt
      DISCOVERY_SUMMARY: /tmp/emmy-discovery-summary-${{ github.run_id }}-${{ github.run_attempt }}.md
      APP_KEY_FILE: /tmp/emmy-discovery-app-key-${{ github.run_id }}-${{ github.run_attempt }}.pem
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.EXPERIMENT_APP_ID }}
          private-key: ${{ secrets.EXPERIMENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Find rolling discovery pull request
        id: rolling
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const matches = pulls.filter(pull => {
              const labels = pull.labels.map(label => label.name);
              const branch = pull.head.ref;
              const sameRepo = pull.head.repo && pull.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
              return sameRepo && (
                labels.includes('model-discovery') ||
                branch.startsWith('agents/model-discovery-') ||
                branch.startsWith('agents/plan-onboard-')
              );
            });
            if (matches.length > 1) {
              core.setFailed(`Expected at most one rolling model discovery PR, found ${matches.length}`);
              return;
            }
            const pull = matches[0] || null;
            if (pull) {
              core.info(`Updating rolling discovery PR #${pull.number} from ${pull.head.ref}`);
            }
            let branch = pull ? pull.head.ref : '';
            if (!pull) {
              const refs = await github.paginate(github.rest.git.listMatchingRefs, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/agents/model-discovery-',
                per_page: 100,
              });
              const orphanBranches = refs.map(ref => ref.ref.replace('refs/heads/', '')).sort();
              if (orphanBranches.length > 1) {
                core.setFailed(`Expected at most one unpaired model discovery branch, found ${orphanBranches.length}`);
                return;
              }
              branch = orphanBranches[0] || '';
              if (branch) {
                core.info(`Adopting unpaired discovery branch ${branch}`);
              }
            }
            core.setOutput('exists', pull ? 'true' : 'false');
            core.setOutput('number', pull ? String(pull.number) : '');
            core.setOutput('branch', branch);

      - name: Checkout discovery branch
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.rolling.outputs.branch || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Emmy
        run: |
          python3 -m venv venv --prompt "emmy"
          ./venv/bin/pip install -e .

      - name: Run discover-models agent
        env:
          CLOUDRIFT_API_KEY: ${{ secrets.CLOUDRIFT_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          Path(os.environ["AGENT_PROMPT"]).write_text(f"""Use the discover-models skill read-only.

          Review the existing recipes and current demand for both supported and newly released open-weight models.
          Select exactly {os.environ['MAINTAINED_MODEL_COUNT']} existing, fully configured recipes for periodic
          testing and optimization. Prefer current community demand, serving value, architecture coverage, and a
          useful spread of model sizes. Classify every other complete recipe as best-effort or obsolete. Best-effort
          means the model remains useful and runnable, but is not selected for periodic optimization. Obsolete is a
          strict technical judgment: use it only when a named all-around better replacement for the same task is
          available at a comparable or lower practical VRAM footprint. Compare the qualified deployment targets in
          the recipes: the replacement's smallest target must use no more total physical GPU memory than the old
          recipe's smallest target. All-around means the old model has no material advantage in quality, context,
          supported hardware, latency or throughput, operating cost, modality, or licensing. A smaller or quantized
          recipe is not obsolete merely because a larger or unquantized recipe exists. If evidence is ambiguous or
          either model retains a useful advantage, use best-effort. Low demand, age, or exclusion from the maintained
          set is not sufficient. A previously obsolete recipe may become maintained or best-effort when the evidence
          changes. Never classify an onboarding/untested shell. Keep research bounded: use the repository inventory
          and at most six targeted public-web searches, then write the manifest. Do not keep researching once every
          maintained choice and obsolete proposal has enough evidence for this conservative classification.

          Also select zero to three new models with no recipe, all suitable for the exact target
          {os.environ['TARGET_GPU']} x {os.environ['TARGET_GPU_COUNT']}. These will become untested onboarding recipe
          shells. Keep at most three onboarding shells total: every existing onboarding/untested recipe consumes one
          slot, so select no new model when three already exist. Do not claim shells have been deployed or benchmarked.
          Do not edit the repository, rent hardware, or deploy anything.

          Before your final response, call write_file once with path {os.environ['AGENT_MANIFEST']} and content equal
          to exactly one JSON object without a Markdown fence:
          {{
            "maintained_models": ["exact/org-model IDs for existing recipes; exactly {os.environ['MAINTAINED_MODEL_COUNT']}"],
            "best_effort_models": ["exact/org-model IDs for every useful lower-priority complete recipe"],
            "obsolete_models": [
              {{"model_id": "org/old-model", "replacement_model_id": "org/better-model",
                "rationale": "qualified target VRAM comparison and why the old model retains no material advantage"}}
            ],
            "onboarding_models": [
              {{"model_id": "org/model", "task": "generate", "gpu": "{os.environ['TARGET_GPU']}",
                "gpu_count": {os.environ['TARGET_GPU_COUNT']}, "rationale": "brief evidence-backed reason"}}
            ]
          }}
          Use task "embed" only for an embedding model. Return an empty onboarding_models list when nothing new is
          suitable. The manifest file is required; do not edit any repository file. After write_file succeeds, your
          final response may only confirm completion.
          """)
          PY
          printf '%s' "$CLOUDRIFT_API_KEY" > "$AGENT_KEY_FILE"
          chmod 600 "$AGENT_KEY_FILE"
          unset CLOUDRIFT_API_KEY
          set +e
          env -u CLOUDRIFT_API_KEY ./venv/bin/emmy agent run \
            --api-key-file "$AGENT_KEY_FILE" \
            --skill .claude/skills/discover-models/SKILL.md \
            --prompt "$AGENT_PROMPT" \
            --model "$AGENT_MODEL" \
            --output "$AGENT_TRANSCRIPT" \
            --max-turns 32 \
            --allow-write "$AGENT_MANIFEST"
          agent_status=$?
          set -e
          if [ "$agent_status" -ne 0 ] && [ ! -s "$AGENT_MANIFEST" ]; then
            exit "$agent_status"
          fi
          if [ "$agent_status" -ne 0 ]; then
            echo "Agent confirmation failed after the manifest was written; continuing to repository validation."
          fi

      - name: Verify discovery was read-only
        run: test -z "$(git status --porcelain)"

      - name: Validate and apply model lifecycle
        id: lifecycle
        run: |
          ./venv/bin/python .github/scripts/discovery_lifecycle.py \
            --input "$AGENT_MANIFEST" \
            --gpu "$TARGET_GPU" \
            --gpu-count "$TARGET_GPU_COUNT" \
            --maintained-count "$MAINTAINED_MODEL_COUNT" \
            --summary "$DISCOVERY_SUMMARY"
          git diff --check

      - name: Configure renewable GitHub App credentials
        if: steps.lifecycle.outputs.changed == 'true'
        env:
          APP_PRIVATE_KEY: ${{ secrets.EXPERIMENT_APP_PRIVATE_KEY }}
          APP_ID: ${{ secrets.EXPERIMENT_APP_ID }}
        run: |
          rm -f -- "$APP_KEY_FILE"
          printf '%s' "$APP_PRIVATE_KEY" > "$APP_KEY_FILE"
          chmod 600 "$APP_KEY_FILE"
          git config user.name "emmy-onboarding-bot"
          git config user.email "emmy-onboarding-bot[bot]@users.noreply.github.com"
          git config credential.helper ""
          git config --add credential.helper \
            "!APP_ID=$APP_ID APP_KEY_FILE=$APP_KEY_FILE $GITHUB_WORKSPACE/.github/scripts/git-credential-github-app.sh"

      - name: Commit and push rolling lifecycle update
        if: steps.lifecycle.outputs.changed == 'true'
        id: branch
        env:
          EXISTING_BRANCH: ${{ steps.rolling.outputs.branch }}
        run: |
          branch="$EXISTING_BRANCH"
          if [ -n "$branch" ]; then
            git switch -C "$branch"
          else
            branch="agents/model-discovery-${GITHUB_RUN_ID}"
            git switch -c "$branch"
          fi
          git add --all -- recipes plans
          git diff --cached --check
          git commit -m "recipes: refresh model lifecycle"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Refresh GitHub App token
        id: app-token-refresh
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.EXPERIMENT_APP_ID }}
          private-key: ${{ secrets.EXPERIMENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Create or update rolling discovery pull request
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.rolling.outputs.number }}
          PLAN_BRANCH: ${{ steps.branch.outputs.branch || steps.rolling.outputs.branch }}
        with:
          github-token: ${{ steps.app-token-refresh.outputs.token }}
          script: |
            const fs = require('fs');
            const labels = [
              {name: 'model-discovery', description: 'Automated model recipe lifecycle', color: '5319E7'},
              {name: 'model-onboarding', description: 'Automated model discovery and onboarding', color: '1D76DB'},
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({owner: context.repo.owner, repo: context.repo.repo, ...label});
              } catch (error) {
                if (error.status !== 422) throw error;
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  new_name: label.name,
                  description: label.description,
                  color: label.color,
                });
              }
            }

            const title = 'Refresh model lifecycle and onboarding';
            const body = fs.readFileSync(process.env.DISCOVERY_SUMMARY, 'utf8');
            let pullNumber = Number(process.env.PR_NUMBER || 0);
            if (pullNumber) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                title,
                body,
              });
            } else {
              const result = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: process.env.PLAN_BRANCH,
                base: context.payload.repository.default_branch,
                title,
                body,
                draft: true,
              });
              pullNumber = result.data.number;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              labels: labels.map(label => label.name),
            });

      - name: Cleanup discovery credentials and output
        if: always()
        run: |
          rm -f \
            "$APP_KEY_FILE" \
            "$AGENT_PROMPT" \
            "$AGENT_MANIFEST" \
            "$AGENT_TRANSCRIPT" \
            "$DISCOVERY_SUMMARY" \
            "$AGENT_KEY_FILE"
          git config --unset-all credential.helper || true
