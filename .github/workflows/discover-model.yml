name: Discover model

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      gpu:
        description: Exact GPU name from emmy/hardware.py
        required: false
        type: string
      gpu_count:
        description: Exact GPU count
        required: false
        type: number

concurrency:
  group: model-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: [self-hosted, agents]
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    env:
      TARGET_GPU: ${{ inputs.gpu || vars.DISCOVERY_TARGET_GPU || 'NVIDIA H200 141GB' }}
      TARGET_GPU_COUNT: ${{ inputs.gpu_count || vars.DISCOVERY_TARGET_GPU_COUNT || 1 }}
      AGENT_MODEL: ${{ vars.ONBOARD_AGENT_MODEL || 'Qwen/Qwen3.6-35B-A3B-FP8' }}
      CLOUDRIFT_INFERENCE_URL: ${{ vars.CLOUDRIFT_INFERENCE_URL || 'https://inference.cloudrift.ai/v1' }}
      AGENT_KEY_FILE: /tmp/emmy-discovery-agent-key-${{ github.run_id }}-${{ github.run_attempt }}
      AGENT_PROMPT: /tmp/emmy-discovery-prompt-${{ github.run_id }}-${{ github.run_attempt }}.md
      AGENT_OUTPUT: /tmp/emmy-discovery-selection-${{ github.run_id }}-${{ github.run_attempt }}.json
      PLAN_PATH_FILE: /tmp/emmy-discovery-plan-${{ github.run_id }}-${{ github.run_attempt }}.txt
      APP_KEY_FILE: /tmp/emmy-discovery-app-key-${{ github.run_id }}-${{ github.run_attempt }}.pem
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.EXPERIMENT_APP_ID }}
          private-key: ${{ secrets.EXPERIMENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Enforce open onboarding PR cap
        id: cap
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const count = pulls.filter(pull => pull.labels.some(label => label.name === 'model-onboarding')).length;
            core.info(`${count} open model-onboarding pull request(s)`);
            core.setOutput('allowed', count < 3 ? 'true' : 'false');

      - name: Checkout default branch
        if: steps.cap.outputs.allowed == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        if: steps.cap.outputs.allowed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Emmy
        if: steps.cap.outputs.allowed == 'true'
        run: |
          python3 -m venv venv --prompt "emmy"
          ./venv/bin/pip install -e .

      - name: Run discover-models agent
        if: steps.cap.outputs.allowed == 'true'
        env:
          CLOUDRIFT_API_KEY: ${{ secrets.CLOUDRIFT_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          Path(os.environ["AGENT_PROMPT"]).write_text(f"""Use the discover-models skill read-only.

          Consider only the exact target {os.environ['TARGET_GPU']} x {os.environ['TARGET_GPU_COUNT']}. Select at
          most one interesting open-weight model for which this checkout has no recipe. Weight current community
          value and expected serving value most heavily. Do not deploy, rent hardware, or edit the repository.

          Return exactly one JSON object as the final response, without a Markdown fence:
          {{"model_id": null, "gpu": "{os.environ['TARGET_GPU']}",
            "gpu_count": {os.environ['TARGET_GPU_COUNT']}, "rationale": "brief evidence-backed reason"}}
          Replace null with one exact "org/model" ID only when selected. Use null and an empty rationale when there
          is no suitable model.
          """)
          PY
          printf '%s' "$CLOUDRIFT_API_KEY" > "$AGENT_KEY_FILE"
          chmod 600 "$AGENT_KEY_FILE"
          unset CLOUDRIFT_API_KEY
          exec env -u CLOUDRIFT_API_KEY ./venv/bin/emmy agent run \
            --api-key-file "$AGENT_KEY_FILE" \
            --skill .claude/skills/discover-models/SKILL.md \
            --prompt "$AGENT_PROMPT" \
            --model "$AGENT_MODEL" \
            --output "$AGENT_OUTPUT"

      - name: Verify discovery was read-only
        if: steps.cap.outputs.allowed == 'true'
        run: test -z "$(git status --porcelain)"

      - name: Validate discovery selection
        if: steps.cap.outputs.allowed == 'true'
        id: selection
        run: |
          ./venv/bin/python .github/scripts/discovery_selection.py \
            --input "$AGENT_OUTPUT" \
            --gpu "$TARGET_GPU" \
            --gpu-count "$TARGET_GPU_COUNT"

      - name: Skip a duplicate onboarding pull request
        if: steps.selection.outputs.found == 'true'
        id: duplicate
        uses: actions/github-script@v7
        env:
          MODEL_ID: ${{ steps.selection.outputs.model_id }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const marker = `\`${process.env.MODEL_ID}\``;
            const onboardingPulls = pulls.filter(pull =>
              pull.labels.some(label => label.name === 'model-onboarding')
            );
            const duplicate = onboardingPulls.find(pull =>
              pull.labels.some(label => label.name === 'model-onboarding') &&
              (pull.title.includes(process.env.MODEL_ID) || (pull.body || '').includes(marker))
            );
            if (duplicate) {
              core.info(`Skipping ${process.env.MODEL_ID}; onboarding PR #${duplicate.number} is already open`);
            }
            core.setOutput('exists', duplicate ? 'true' : 'false');
            core.setOutput('allowed', onboardingPulls.length < 3 ? 'true' : 'false');

      - name: Create onboarding plan
        if: >-
          steps.selection.outputs.found == 'true' &&
          steps.duplicate.outputs.allowed == 'true' &&
          steps.duplicate.outputs.exists != 'true'
        env:
          MODEL_ID: ${{ steps.selection.outputs.model_id }}
          RATIONALE: ${{ steps.selection.outputs.rationale }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import textwrap
          from pathlib import Path

          model_id = os.environ["MODEL_ID"]
          slug = re.sub(r"[^a-z0-9]+", "-", model_id.lower()).strip("-")
          path = Path("plans") / f"onboard-{slug}.md"
          rationale = textwrap.fill(
              os.environ["RATIONALE"],
              width=116,
              initial_indent="- Rationale: ",
              subsequent_indent="  ",
          )
          heading = f"""\
          # Onboard {model_id}

          - Hugging Face model: `{model_id}`
          - Exact target: `{os.environ['TARGET_GPU']} x{os.environ['TARGET_GPU_COUNT']}`
          """
          instructions = """\
          Run the **Onboard model** workflow from this pull request branch. The workflow must use the exact target,
          update this branch, and remove this plan after producing:

          - `recipes/<model>/recipe.yaml`;
          - `recipes/<model>/RESULTS.md`;
          - a reproducible serving experiment and its successful raw results;
          - when Emmy is eligible, tuned kernels and a verified prebuilt CloudRiftAI image.
          """
          path.write_text(textwrap.dedent(heading) + rationale + "\n\n" + textwrap.dedent(instructions))
          Path(os.environ["PLAN_PATH_FILE"]).write_text(str(path))
          PY
          git add "$(cat "$PLAN_PATH_FILE")"
          git diff --cached --check

      - name: Configure renewable GitHub App credentials
        if: >-
          steps.selection.outputs.found == 'true' &&
          steps.duplicate.outputs.allowed == 'true' &&
          steps.duplicate.outputs.exists != 'true'
        env:
          APP_PRIVATE_KEY: ${{ secrets.EXPERIMENT_APP_PRIVATE_KEY }}
          APP_ID: ${{ secrets.EXPERIMENT_APP_ID }}
        run: |
          rm -f -- "$APP_KEY_FILE"
          printf '%s' "$APP_PRIVATE_KEY" > "$APP_KEY_FILE"
          chmod 600 "$APP_KEY_FILE"
          git config user.name "emmy-onboarding-bot"
          git config user.email "emmy-onboarding-bot[bot]@users.noreply.github.com"
          git config credential.helper ""
          git config --add credential.helper \
            "!APP_ID=$APP_ID APP_KEY_FILE=$APP_KEY_FILE $GITHUB_WORKSPACE/.github/scripts/git-credential-github-app.sh"

      - name: Push plan branch
        if: >-
          steps.selection.outputs.found == 'true' &&
          steps.duplicate.outputs.allowed == 'true' &&
          steps.duplicate.outputs.exists != 'true'
        id: branch
        env:
          MODEL_ID: ${{ steps.selection.outputs.model_id }}
        run: |
          slug=$(printf '%s' "$MODEL_ID" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-|-$//g')
          branch="agents/plan-onboard-${slug}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "plan: onboard $MODEL_ID"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Refresh GitHub App token
        if: >-
          steps.selection.outputs.found == 'true' &&
          steps.duplicate.outputs.allowed == 'true' &&
          steps.duplicate.outputs.exists != 'true'
        id: app-token-refresh
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.EXPERIMENT_APP_ID }}
          private-key: ${{ secrets.EXPERIMENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Open labeled onboarding plan PR
        if: >-
          steps.selection.outputs.found == 'true' &&
          steps.duplicate.outputs.allowed == 'true' &&
          steps.duplicate.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token-refresh.outputs.token }}
          MODEL_ID: ${{ steps.selection.outputs.model_id }}
          RATIONALE: ${{ steps.selection.outputs.rationale }}
          PLAN_BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          gh label create model-onboarding \
            --description "Automated model discovery and onboarding" \
            --color 1D76DB --force
          gh pr create \
            --draft \
            --head "$PLAN_BRANCH" \
            --base "${{ github.event.repository.default_branch }}" \
            --title "Plan onboarding for $MODEL_ID" \
            --label model-onboarding \
            --body "Model discovery selected \`$MODEL_ID\` for \`$TARGET_GPU x$TARGET_GPU_COUNT\`.\n\n$RATIONALE\n\nRun **Onboard model** from this PR branch to replace the plan with measured artifacts."

      - name: Cleanup discovery credentials and output
        if: always()
        run: |
          rm -f \
            "$APP_KEY_FILE" \
            "$AGENT_PROMPT" \
            "$AGENT_OUTPUT" \
            "$PLAN_PATH_FILE" \
            "$AGENT_KEY_FILE"
          git config --unset-all credential.helper || true
