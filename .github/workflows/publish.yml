name: Publish to PyPI

# pyproject.toml holds the version either way. Two ways in:
#   * run this workflow — it publishes to PyPI first and then creates the tag and
#     release, so a failed upload leaves nothing behind;
#   * publish a GitHub Release by hand — the tag must then agree with pyproject.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: make setup-ci

      - name: Ruff check
        run: ./venv/bin/ruff check

      - name: Ruff format check
        run: ./venv/bin/ruff format --check

      # Cache the HuggingFace hub downloads (TinyLlama-1.1B-Chat-v1.0 +
      # Qwen/Qwen3-Embedding-0.6B). The anonymous HF CDN rate-limits the
      # shared runner egress IPs — 429s on config.json have killed multiple
      # runs — and with a populated cache ``from_pretrained`` falls back to
      # the cached files when the hub is unreachable. Bump the key suffix
      # when tests start needing new models.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1

      - name: Run tests
        run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve the version to publish
        id: version
        run: |
          PKG_VERSION=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # We mint the tag ourselves, so pyproject is the only input. Bumping it
            # is what makes a release; refuse if that bump was forgotten.
            if git ls-remote --exit-code --tags origin "refs/tags/v$PKG_VERSION" >/dev/null 2>&1; then
              echo "::error::v$PKG_VERSION is already released — bump version in pyproject.toml"
              exit 1
            fi
          elif [ "$PKG_VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Version mismatch: pyproject.toml=$PKG_VERSION, tag=$GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      # Bundle the recipes into the package, and point the README's repo-relative
      # links at GitHub — PyPI renders the README detached from the repo.
      - name: Stage the source tree for distribution
        run: python scripts/prepare_dist.py --recipes --readme

      - run: pip install build

      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # Only for the dispatched path: a hand-published release already has both.
  github-release:
    needs: [build, publish]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
