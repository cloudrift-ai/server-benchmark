name: Tests

on:
  pull_request:
    branches: [main]

# Cancel in-flight test runs when a new commit lands on the same pull request.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: make setup-ci

      - name: Ruff check
        run: ./venv/bin/ruff check

      - name: Ruff format check
        run: ./venv/bin/ruff format --check

  test:
    runs-on:
      group: ubuntu-runners
    # A hung suite must fail, not occupy a runner indefinitely: a corpus-decode explosion sat in
    # "Run tests" for over an hour before anyone noticed. The healthy run is single-digit minutes,
    # so 20 leaves ample headroom while still failing fast on a regression.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: make setup-ci

      # Cache the HuggingFace hub downloads (TinyLlama-1.1B-Chat-v1.0 +
      # Qwen/Qwen3-Embedding-0.6B). The anonymous HF CDN rate-limits the
      # shared runner egress IPs — 429s on config.json have killed multiple
      # runs — and with a populated cache ``from_pretrained`` falls back to
      # the cached files when the hub is unreachable. Bump the key suffix
      # when tests start needing new models.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1

      - name: Run tests
        run: make test

  package:
    name: PyPI package dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build with the release path without publishing
        run: make pypi-dist

      - name: Verify both distribution artifacts exist
        run: |
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
