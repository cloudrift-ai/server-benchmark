    name: square.512
    M: 512
    N: 512
    K: 512
    knobs: {BM: 8, BN: 16, BK: 64, BR: 1, FM: 4, FN: 2, FK: 1, SPLITK: 4, RING: 3, STAGE: '11'}
    emmy_us: 17.4
    cublas_us: 10.8
