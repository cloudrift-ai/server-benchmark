# Re-baselined 2026-07-06 on post-#269 (Block-DAG Tile IR) codegen: live -O3 `run --bench` latencies. The #269
# rewrite deliberately dropped optimizations (operand staging, cp.async ring, CTA swizzle) that are being
# reintroduced gradually; the pre-#269 numbers are the long-term target — recover them via
# `git show 272153d3:emmy/compiler/pipeline/search/goldens/rtx4090_sm89.yaml`. Context + per-shape drift:
# plans/golden-sweep-rtx4090-findings.md. Six entries where the greedy pick beat the legacy-recorded knobs carry
# greedy's config in the native `MOVE@element` vocabulary (new goldens speak native — see `_knob_legacy`); the
# rest keep their legacy-keyed knobs (ingest-only ramp) at live latencies.
gpu_name: NVIDIA GeForce RTX 4090
compute_cap: [8, 9]
configs:
