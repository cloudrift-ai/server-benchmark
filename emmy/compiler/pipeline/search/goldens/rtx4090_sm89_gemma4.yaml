    name: gemma4_12b.o_proj
    M: 512
    N: 3840
    K: 4096
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w1x4/f4x4', REDUCE: '', RASTER: 'gm8', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 109.0
    cublas_us: 115.0
  - kernel: matmul
    name: gemma4_12b.o_proj.dynM
    M: 512
    N: 3840
    K: 4096
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w2x2/f4x4/k2', REDUCE: '', RASTER: '', STAGE: 'd2/cp/ring/p2', WSPEC: ''}
    emmy_us: 108.8
    cublas_us: 115.0
  - kernel: matmul
    name: gemma4_12b.o_proj.dynM
    M: 512
    N: 3840
    K: 4096
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w2x2/f4x8/k2', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 88.8
    cublas_us: 115.0
  # ---- MLP -------------------------------------------------------------------------------------------
