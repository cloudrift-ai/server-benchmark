    emmy_us: 718.8
    cublas_us: 799.0
  # mlp_down (deep K 15360): std at parity on the un-k'd wide tile; fm 1.34x.
  - kernel: matmul
    name: gemma4_12b.mlp_down
    M: 512
    N: 3840
    K: 15360
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w2x2/f4x8', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 395.3
    cublas_us: 392.0
  - kernel: matmul
    name: gemma4_12b.mlp_down
    M: 512
    N: 3840
    K: 15360
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w2x2/f4x8/k2', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 291.7
    cublas_us: 392.0
  # (2026-07-22, merged-sibling WS1) The four mlp_down dynM entries were DELETED: the sibling-linear
  # concat fuses the GeGLU combine cone into the sym down matmul, so the fork only offers d*/sync
  # computed-A rows and the recorded cp/ring rows can never realize again (permanent DRIFT). The
  # re-seed needs a 4090 (manual pinned --ab on the cone-bearing dyn snippet — see the 5090 file's
  # mlp_down.dynM comment); until then the sym down fork is baselined in the drift gate.
  # ---- attention (flash, hd256, STATIC — the .dynM golden lives in rtx4090_sm89.yaml) ----------------
  # Values re-measured 2026-07-13 after the causal tile-skip (3x reproduced, ≤0.3 µs spread). Same
  # w4x1 geometry + pin-spelling contract as the 5090 file (TILE@pj is the PV plan w4x1/f1x32; a
  # dd-spelled pj matches nothing). The pre-skip "nt=4 realizes back to nt=2 on sm_89" note is
  # OBSOLETE — post-skip the nt=4 row realizes and stamps cleanly (the std primary below); w2x1
  # reaches 43.6. Every lane is now PAST torch SDPA (41.0). d3 / p2 within noise; no TMA on this cap.
  - kernel: attention
    name: gemma4_12b.attention.hd256
    n_heads: 16
    seq: 512
    head_dim: 256
    dtype: 'fp16'
    causal: true
    knobs: {PLACE: 'fuse', STAGE: 'd2/cp/ring', 'TILE@dd': 'a:mma_m16n8k16_f16_f32/w4x1/f1x2/k16', 'TILE@pj': 'a:mma_m16n8k16_f16_f32/w4x1/f1x32', WSPEC: ''}
    emmy_us: 41.1
    cublas_us: 41.0
  # The std-lane PRIMARY (2026-07-14, alternating staging): the 64-key block on d1/cp/alt (the
  # commit-group alternating pipeline + Q-in-smem) — 37.1 = 1.11x vs torch SDPA, 3x reproduced.
  - kernel: attention
    name: gemma4_12b.attention.hd256
    n_heads: 16
    seq: 512
    head_dim: 256
    dtype: 'fp16'
    causal: true
    knobs: {PLACE: 'fuse', STAGE: 'd1/cp/alt', 'TILE@dd': 'a:mma_m16n8k16_f16_f32/w4x1/f1x8/k16', 'TILE@pj': 'a:mma_m16n8k16_f16_f32/w4x1/f1x32/k4', WSPEC: ''}
    emmy_us: 37.1
    cublas_us: 41.0
  # The FM PRIMARY: the f16acc-PV sibling on d1/cp/alt — 33.8 = 1.21x vs torch SDPA (3x reproduced),
  # a 10% jump over the paired-ring fm nt=2 frontier below.
  - kernel: attention
    name: gemma4_12b.attention.hd256
    n_heads: 16
    seq: 512
    head_dim: 256
    dtype: 'fp16'
    causal: true
    knobs: {PLACE: 'fuse', STAGE: 'd1/cp/alt', 'TILE@dd': 'a:mma_m16n8k16_f16_f32/w4x1/f1x8/k16', 'TILE@pj': 'a:mma_m16n8k16_f16_f16/w4x1/f1x32/k4', WSPEC: ''}
    emmy_us: 33.8
    cublas_us: 41.0
  # The paired-ring nt=4 runner-up (pre-alt std primary) — 1.07x past torch SDPA.
  - kernel: attention
    name: gemma4_12b.attention.hd256
    n_heads: 16
    seq: 512
    head_dim: 256
    dtype: 'fp16'
    causal: true
    knobs: {PLACE: 'fuse', STAGE: 'd2/cp/ring', 'TILE@dd': 'a:mma_m16n8k16_f16_f32/w4x1/f1x4/k16', 'TILE@pj': 'a:mma_m16n8k16_f16_f32/w4x1/f1x32/k2', WSPEC: ''}
    emmy_us: 38.3
    cublas_us: 41.0
  # (A second fm sibling — the nt=2 d2/cp/ring PV-f16acc form at 37.6 — was dropped 2026-07-21 by the
  # fm-never-loses invariant: it recorded above both the std best (37.1) and the fm cp-alt row (33.8),
  # so the fastest-first picker could never realize it in either lane. The fm nt-preference note it
  # carried: the sm_89 fm lane keeps nt=2 on this transport, fm nt=4 was 41.8.)
  # The norm rows (2026-07-14, 3x reproduced) — filled the coverage gap vs the 5090 file. b256 wins
  # the block-split fork on both forms (b128 7.7 / b512 7.6); the greedy pick lands b128 (7.6) on
  # the static shape, so the row matters. Note: a missing per-GPU row also blocks `run --golden`
  # name resolution on this card (live_gpu scoping), which is how the gap surfaced.
  - kernel: rms_norm
    name: gemma4_12b.rms_norm.k3840
    M: 512
    K: 3840
    knobs: {REDUCE: 'b256'}
    emmy_us: 6.9
    cublas_us: 7.0
  - kernel: rms_norm
    name: gemma4_12b.rms_norm.k3840.dynM
    M: 512
    K: 3840
    dynamic: true
    knobs: {REDUCE: 'b256'}
    emmy_us: 6.9
    cublas_us: 7.0
  # qknorm: b64 wins (b128 3.85, b256 6.0, b512 11.2 — the wide splits starve the 4096-row grid).
  - kernel: rms_norm
    name: gemma4_12b.qknorm.k256
    M: 4096
    K: 256
    knobs: {REDUCE: 'b64'}
    emmy_us: 3.6
    cublas_us: 4.8
  # ---- seq-2048 tier (2026-07-14) ----------------------------------------------------------------
  # M=2048 drops the split-K almost everywhere on this card (the grid fills; only deep-K mlp_down
  # keeps g2k) — fm serial wins all three projections. Winners 2-3x reproduced (o_proj fm had one
  # outlier run at 325, settled 297.6/298.0); cublas_us = live torch same-session. cp.async only
  # (sm_89). Attention: the fm lane keeps the RING here (nt2 288.8 = 1.09x vs SDPA 314.6; fm-alt
  # jitters 311-341 and loses) while the std lane takes alt (346.8 vs ring 360) — the alt/ring and
  # lane preferences flip per (card, seq) as usual. Cold greedy on the unseeded 2048 attention
  # shape deploys a w1x1 kernel at ~1080 (3.4x off) — the rows pin that.
