# Gemma-4-12B kernel shapes (hidden 3840, intermediate 15360, 16 Q / 8 KV heads, head_dim 256) on the
# RTX 4090 — seeded 2026-07-13 by a manual pinned --ab sweep on a rented CloudRift box (no tuner), each
# entry 3x reproduced at <=1% spread. cublas_us is the median live `Eager PyTorch` row (cuBLAS HGEMM for
# the matmuls, torch SDPA for attention). Companion of rtx5090_sm120_gemma4.yaml; the gemma norm entries
# (rms_norm.k3840(+dynM), gemma4_12b.qknorm.k256) and attention.hd256.dynM already live in
# rtx4090_sm89.yaml and are NOT duplicated here.
#
# sm_89 notes: all cp.async staging (no TMA tier on this cap). The std lane's q/o_proj winner is the
# un-split w2x2/f4x4/k2 on d2/cp/ring/p2 (the ldmatrix reg double-buffer); kv_proj and mlp_gate_up std
# sit BELOW parity (0.86x / 0.91x — the known sm_89 latency-bound residual; nothing in the knob space
# closes it, matching the h4096 twins). The fm lane is the post-swizzle f16acc atom-swap family
# (w2x2/f4x8/k2, w4x1/f4x8/k2 on gate_up) — 1.02-1.35x past cuBLAS everywhere. Post causal tile-skip
# (2026-07-13) every attention lane beats torch SDPA: std nt4 38.3, fm nt2 37.6 vs SDPA 41.0.
gpu_name: NVIDIA GeForce RTX 4090
compute_cap:
  - 8
  - 9
configs:
  # ---- attention projections -------------------------------------------------------------------------
  - kernel: matmul
    name: gemma4_12b.q_proj
    M: 512
    N: 4096
    K: 3840
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w2x2/f4x4/k2', REDUCE: '', RASTER: '', STAGE: 'd2/cp/ring/p2', WSPEC: ''}
    emmy_us: 102.3
    cublas_us: 104.0
  - kernel: matmul
    name: gemma4_12b.q_proj
    M: 512
    N: 4096
    K: 3840
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w2x2/f4x8/k2', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 84.5
    cublas_us: 104.0
  - kernel: matmul
    name: gemma4_12b.q_proj.dynM
    M: 512
    N: 4096
    K: 3840
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w2x2/f4x4/k2', REDUCE: '', RASTER: '', STAGE: 'd2/cp/ring/p2', WSPEC: ''}
    emmy_us: 101.9
    cublas_us: 103.0
  - kernel: matmul
    name: gemma4_12b.q_proj.dynM
    M: 512
    N: 4096
    K: 3840
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w2x2/f4x8/k2', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 84.0
    cublas_us: 103.0
  # kv_proj (8 KV heads x 256 = N 2048; k/v dedup into one kernel launched twice). The std lane tops out
  # at 0.86x (w1x4/f4x4 g2k ties, g4k/g8k/p2/f4x8 all worse) — sm_89 residual; the fm g4k entry is the
  # deployable winner at 1.02x.
  - kernel: matmul
    name: gemma4_12b.kv_proj
    M: 512
    N: 2048
    K: 3840
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w2x2/f4x4/k2', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 57.2
    cublas_us: 49.0
  - kernel: matmul
    name: gemma4_12b.kv_proj
    M: 512
    N: 2048
    K: 3840
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w2x2/f4x8/k2', REDUCE: 'g4k', RASTER: '', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 48.0
    cublas_us: 49.0
  - kernel: matmul
    name: gemma4_12b.kv_proj.dynM
    M: 512
    N: 2048
    K: 3840
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w2x2/f4x4/k2', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 58.4
    cublas_us: 49.0
  - kernel: matmul
    name: gemma4_12b.kv_proj.dynM
    M: 512
    N: 2048
    K: 3840
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w2x2/f4x8/k2', REDUCE: 'g4k', RASTER: '', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 47.8
    cublas_us: 49.0
  - kernel: matmul
    name: gemma4_12b.o_proj
    M: 512
    N: 3840
    K: 4096
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w2x2/f4x4/k2', REDUCE: '', RASTER: '', STAGE: 'd2/cp/ring/p2', WSPEC: ''}
    emmy_us: 109.3
    cublas_us: 115.0
  - kernel: matmul
    name: gemma4_12b.o_proj
    M: 512
    N: 3840
    K: 4096
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w2x2/f4x8/k2', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 85.8
    cublas_us: 115.0
  # Parity add (2026-07-15 cold golden sweep, rented 4090): the un-split w1x4/f4x4 tile through the
  # gm8 raster codec — the sweep's greedy pick, 109.0 pinned-vs-pinned vs 110.0-110.3 for the p2
  # incumbent above (0.99x, 2 --ab reps). Different structural family at parity; recorded per the
  # add gate.
  - kernel: matmul
    name: gemma4_12b.o_proj
    M: 512
    N: 3840
    K: 4096
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w1x4/f4x4', REDUCE: '', RASTER: 'gm8', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 109.0
    cublas_us: 115.0
  - kernel: matmul
    name: gemma4_12b.o_proj.dynM
    M: 512
    N: 3840
    K: 4096
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w2x2/f4x4/k2', REDUCE: '', RASTER: '', STAGE: 'd2/cp/ring/p2', WSPEC: ''}
    emmy_us: 108.8
    cublas_us: 115.0
  - kernel: matmul
    name: gemma4_12b.o_proj.dynM
    M: 512
    N: 3840
    K: 4096
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w2x2/f4x8/k2', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 88.8
    cublas_us: 115.0
  # ---- MLP -------------------------------------------------------------------------------------------
  # mlp_gate_up (fused gate+up, N 30720): std 0.91x — better than the h4096 twin's 0.78x but still the
  # sm_89 gate_up gap (w4x1/f4x4/k2, w2x4/f4x4, w1x4/f4x8, w2x2 and p2 all worse). fm at 1.11x.
  # 2026-07-15 cold golden sweep (rented 4090): the narrow-N w2x2/f2x8/k2 tile + gm8 raster codec
  # replaces w4x1/f4x8/k2 (877.6 recorded, 872-876 live) — 810.0 pinned-vs-pinned (0.93x, 2 --ab
  # reps), greedy-row 754-758 across 3 reps. Mirrors the h4096 gate_up flip; std lane now 1.01x vs
  # cuBLAS (from 1.10x).
  - kernel: matmul
    name: gemma4_12b.mlp_gate_up
    M: 512
    N: 30720
    K: 3840
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w2x2/f2x8/k2', REDUCE: '', RASTER: 'gm8', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 810.0
    cublas_us: 801.0
  - kernel: matmul
    name: gemma4_12b.mlp_gate_up
    M: 512
    N: 30720
    K: 3840
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w4x1/f4x8/k2', REDUCE: '', RASTER: '', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 719.9
    cublas_us: 801.0
  - kernel: matmul
    name: gemma4_12b.mlp_gate_up.dynM
    M: 512
    N: 30720
    K: 3840
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w4x1/f4x8/k2', REDUCE: '', RASTER: '', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 879.6
    cublas_us: 799.0
  - kernel: matmul
    name: gemma4_12b.mlp_gate_up.dynM
    M: 512
    N: 30720
    K: 3840
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w4x1/f4x8/k2', REDUCE: '', RASTER: '', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 718.8
    cublas_us: 799.0
  # mlp_down (deep K 15360): std at parity on the un-k'd wide tile; fm 1.34x.
  - kernel: matmul
    name: gemma4_12b.mlp_down
    M: 512
    N: 3840
    K: 15360
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w2x2/f4x8', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 395.3
    cublas_us: 392.0
  - kernel: matmul
    name: gemma4_12b.mlp_down
    M: 512
    N: 3840
    K: 15360
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w2x2/f4x8/k2', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 291.7
    cublas_us: 392.0
  - kernel: matmul
    name: gemma4_12b.mlp_down.dynM
    M: 512
    N: 3840
    K: 15360
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w2x2/f4x8', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 395.8
    cublas_us: 393.0
  - kernel: matmul
    name: gemma4_12b.mlp_down.dynM
    M: 512
    N: 3840
    K: 15360
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w2x2/f4x8/k2', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/cp/ring', WSPEC: ''}
    emmy_us: 293.0
    cublas_us: 393.0
  # ---- attention (flash, hd256, STATIC — the .dynM golden lives in rtx4090_sm89.yaml) ----------------
  # Values re-measured 2026-07-13 after the causal tile-skip (3x reproduced, ≤0.3 µs spread). Same
  # w4x1 geometry + pin-spelling contract as the 5090 file (TILE@pj is the PV plan w4x1/f1x32; a
  # dd-spelled pj matches nothing). The pre-skip "nt=4 realizes back to nt=2 on sm_89" note is
  # OBSOLETE — post-skip the nt=4 row realizes and stamps cleanly (the std primary below); w2x1
  # reaches 43.6. Every lane is now PAST torch SDPA (41.0). d3 / p2 within noise; no TMA on this cap.
  - kernel: attention
    name: gemma4_12b.attention.hd256
    n_heads: 16
    seq: 512
    head_dim: 256
    dtype: 'fp16'
    causal: true
    knobs: {PLACE: 'fuse', STAGE: 'd2/cp/ring', 'TILE@dd': 'a:mma_m16n8k16_f16_f32/w4x1/f1x2/k16', 'TILE@pj': 'a:mma_m16n8k16_f16_f32/w4x1/f1x32', WSPEC: ''}
    emmy_us: 41.1
    cublas_us: 41.0
  # The std-lane PRIMARY (2026-07-14, alternating staging): the 64-key block on d1/cp/alt (the
  # commit-group alternating pipeline + Q-in-smem) — 37.1 = 1.11x vs torch SDPA, 3x reproduced.
  - kernel: attention
    name: gemma4_12b.attention.hd256
    n_heads: 16
    seq: 512
    head_dim: 256
    dtype: 'fp16'
    causal: true
    knobs: {PLACE: 'fuse', STAGE: 'd1/cp/alt', 'TILE@dd': 'a:mma_m16n8k16_f16_f32/w4x1/f1x8/k16', 'TILE@pj': 'a:mma_m16n8k16_f16_f32/w4x1/f1x32/k4', WSPEC: ''}
    emmy_us: 37.1
    cublas_us: 41.0
  # The FM PRIMARY: the f16acc-PV sibling on d1/cp/alt — 33.8 = 1.21x vs torch SDPA (3x reproduced),
  # a 10% jump over the paired-ring fm nt=2 frontier below.
  - kernel: attention
    name: gemma4_12b.attention.hd256
    n_heads: 16
    seq: 512
    head_dim: 256
    dtype: 'fp16'
    causal: true
    knobs: {PLACE: 'fuse', STAGE: 'd1/cp/alt', 'TILE@dd': 'a:mma_m16n8k16_f16_f32/w4x1/f1x8/k16', 'TILE@pj': 'a:mma_m16n8k16_f16_f16/w4x1/f1x32/k4', WSPEC: ''}
    emmy_us: 33.8
    cublas_us: 41.0
  # The paired-ring nt=4 runner-up (pre-alt std primary) — 1.07x past torch SDPA.
  - kernel: attention
    name: gemma4_12b.attention.hd256
    n_heads: 16
    seq: 512
    head_dim: 256
    dtype: 'fp16'
    causal: true
    knobs: {PLACE: 'fuse', STAGE: 'd2/cp/ring', 'TILE@dd': 'a:mma_m16n8k16_f16_f32/w4x1/f1x4/k16', 'TILE@pj': 'a:mma_m16n8k16_f16_f32/w4x1/f1x32/k2', WSPEC: ''}
    emmy_us: 38.3
    cublas_us: 41.0
  # Fast-math sibling (FAST_MATH lane): P·V on the f16-accumulate atom, QK^T stays f32-acc. The overall
  # sm_89 frontier at 1.09x past torch SDPA — and the fm lane keeps nt=2 here (fm nt=4 is 41.8, the
  # nt-preference mirror of the 5090 where fm follows std onto nt=4).
  - kernel: attention
    name: gemma4_12b.attention.hd256
    n_heads: 16
    seq: 512
    head_dim: 256
    dtype: 'fp16'
    causal: true
    knobs: {PLACE: 'fuse', STAGE: 'd2/cp/ring', 'TILE@dd': 'a:mma_m16n8k16_f16_f32/w4x1/f1x2/k16', 'TILE@pj': 'a:mma_m16n8k16_f16_f16/w4x1/f1x32', WSPEC: ''}
    emmy_us: 37.6
    cublas_us: 41.0
  # The norm rows (2026-07-14, 3x reproduced) — filled the coverage gap vs the 5090 file. b256 wins
  # the block-split fork on both forms (b128 7.7 / b512 7.6); the greedy pick lands b128 (7.6) on
  # the static shape, so the row matters. Note: a missing per-GPU row also blocks `run --golden`
  # name resolution on this card (live_gpu scoping), which is how the gap surfaced.
  - kernel: rms_norm
    name: gemma4_12b.rms_norm.k3840
    M: 512
    K: 3840
    knobs: {REDUCE: 'b256'}
    emmy_us: 6.9
    cublas_us: 7.0
  - kernel: rms_norm
    name: gemma4_12b.rms_norm.k3840.dynM
    M: 512
    K: 3840
    dynamic: true
    knobs: {REDUCE: 'b256'}
    emmy_us: 6.9
    cublas_us: 7.0
  # qknorm: b64 wins (b128 3.85, b256 6.0, b512 11.2 — the wide splits starve the 4096-row grid).
  - kernel: rms_norm
    name: gemma4_12b.qknorm.k256
    M: 4096
    K: 256
    knobs: {REDUCE: 'b64'}
    emmy_us: 3.6
    cublas_us: 4.8
