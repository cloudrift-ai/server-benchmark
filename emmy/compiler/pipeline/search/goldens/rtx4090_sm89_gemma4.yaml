  # rtx5090 twin file's section comment). Seeded on the same rented box as the rest of this file;
  # winners 3x reproduced (spreads <=1.1% except where noted). Same structure as the 5090:
  # q_proj_global fm wants SERIAL, o_proj_global takes g2k, and the 5090's k_proj_global fm winner
  # spelling (w2x4/f2x4/k2 g8k) transfers verbatim — but the tiny-N k_proj sits BELOW parity on
  # both lanes here (fm 0.93x, std 0.85x — the sm_89 kv_proj residual, worse at N=512).
  - kernel: matmul
    name: gemma4_12b.q_proj_global
    M: 512
    N: 8192
