  # 2026-07-15 cold golden sweep (rented 4090): the narrow-N w2x2/f2x8/k2 tile + gm8 raster codec
  # replaces w4x1/f4x8/k2 (877.6 recorded, 872-876 live) — 810.0 pinned-vs-pinned (0.93x, 2 --ab
  # reps), greedy-row 754-758 across 3 reps. Mirrors the h4096 gate_up flip; std lane now 1.01x vs
  # cuBLAS (from 1.10x).
  - kernel: matmul
    name: gemma4_12b.mlp_gate_up
    M: 512
    N: 30720
    K: 3840
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w2x2/f2x8/k2', REDUCE: '', RASTER: 'gm8', STAGE: 'd2/cp/ring', WSPEC: ''}
