  # 2026-07-15 cold golden sweep (rented 4090): the narrow-N w2x2/f2x8/k2 tile + gm8 raster codec
  # replaces w4x1/f4x8/k2 (877.6 recorded, 872-876 live) — 810.0 pinned-vs-pinned (0.93x, 2 --ab
