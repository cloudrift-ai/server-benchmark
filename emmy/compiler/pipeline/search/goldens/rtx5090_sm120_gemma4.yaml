# Gemma-4-12B kernel shapes (hidden 3840, intermediate 15360, 16 Q / 8 KV heads, head_dim 256) on the
# RTX 5090 — seeded 2026-07-13 by a manual pinned --ab sweep (no tuner), each entry 3x reproduced at <1%
# spread. cublas_us is the median live `Eager PyTorch` row across the shape's runs (cuBLAS HGEMM for the
# 2026-07-15 refresh (same method, 3x at <0.5% spread): kv_proj.s2048 [fm] moved to the big-tile w4x2/f4x8/k4
# (136.9 -> 109.6), k_proj_global.s2048 std w2x2 -> w4x2 (47.5 -> 45.4) and [fm] k2 -> k4 (37.8 -> 36.4) — the
# gate-fix branch's greedy found all three; see plans/gemma4-12b-layer0-fastmath-ab-tune-findings.md.
# fp16 matmuls, torch RMSNorm / torch SDPA for the norm / attention kinds).
#
# Why these exist: cold greedy on the unseeded projection shapes deploys a scalar b256 tile at ~37 ms
# (~770x off cuBLAS), and on mlp_gate_up.dynM / attention.hd256.dynM it picks kernels that hang outright
# (>1 s accuracy probe / >10 s bench cap) — the misdeploy + hang hazard class these goldens pin down.
#
# Fast-math [fm] siblings (f16-accumulate mma atom) are kept BESIDE the standard entries, never replacing
# them (a gate-off compile can't reach an f16acc config). The big-tile f16acc family (w4x2/f4x8/k4
# d2/tma/ring, split g2k on the small-N shapes) wins 1.3-1.6x vs cuBLAS on every projection — the same
# family as the h4096 [fm] entries in rtx5090_sm120.yaml.
gpu_name: NVIDIA GeForce RTX 5090
model: google/gemma-4-12B
compute_cap:
  - 12
  - 0
configs:
  # ---- attention projections -------------------------------------------------------------------------
  - kernel: matmul
    name: gemma4_12b.q_proj
    M: 512
    N: 4096
    K: 3840
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w4x2/f2x4/k2', REDUCE: 'g8k', RASTER: '', STAGE: 'd2/tma/ring', WSPEC: ''}
    emmy_us: 84.2
    cublas_us: 97.6
  - kernel: matmul
    name: gemma4_12b.q_proj
    M: 512
    N: 4096
    K: 3840
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w4x2/f4x8/k4', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/tma/ring', WSPEC: ''}
    emmy_us: 61.5
    cublas_us: 97.6
  - kernel: matmul
    name: gemma4_12b.q_proj.dynM
    M: 512
    N: 4096
    K: 3840
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w4x2/f2x4/k2', REDUCE: 'g8k', RASTER: '', STAGE: 'd2/tma/ring', WSPEC: ''}
    emmy_us: 84.8
    cublas_us: 98.7
  - kernel: matmul
    name: gemma4_12b.q_proj.dynM
    M: 512
    N: 4096
    K: 3840
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w4x2/f4x8/k4', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/tma/ring', WSPEC: ''}
    emmy_us: 61.7
    cublas_us: 98.7
  # kv_proj: the k/v projections (8 KV heads x 256 = N 2048); the traced graph dedups k and v into one
  # kernel launched twice. Cold greedy here was the 37 ms scalar b256 misdeploy.
  - kernel: matmul
    name: gemma4_12b.kv_proj
    M: 512
    N: 2048
    K: 3840
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w4x2/f2x4/k2', REDUCE: 'g8k', RASTER: '', STAGE: 'd2/tma/ring', WSPEC: ''}
    emmy_us: 45.3
    cublas_us: 48.8
  - kernel: matmul
    name: gemma4_12b.kv_proj
    M: 512
    N: 2048
    K: 3840
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w2x4/f2x4/k4', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/tma/ring', WSPEC: ''}
    emmy_us: 36.4
    cublas_us: 48.8
  - kernel: matmul
    name: gemma4_12b.kv_proj.dynM
    M: 512
    N: 2048
    K: 3840
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w4x2/f2x4/k2', REDUCE: 'g8k', RASTER: '', STAGE: 'd2/tma/ring', WSPEC: ''}
    emmy_us: 45.8
    cublas_us: 48.9
  - kernel: matmul
    name: gemma4_12b.kv_proj.dynM
    M: 512
    N: 2048
    K: 3840
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w2x4/f2x4/k4', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/tma/ring', WSPEC: ''}
    emmy_us: 36.3
    cublas_us: 48.9
  - kernel: matmul
    name: gemma4_12b.o_proj
    M: 512
    N: 3840
    K: 4096
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w4x2/f2x4/k2', REDUCE: 'g4k', RASTER: '', STAGE: 'd2/tma/ring', WSPEC: ''}
    emmy_us: 82.0
    cublas_us: 103.3
  - kernel: matmul
    name: gemma4_12b.o_proj
    M: 512
    N: 3840
    K: 4096
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w4x2/f4x8/k4', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/tma/ring', WSPEC: ''}
    emmy_us: 64.1
    cublas_us: 103.3
  - kernel: matmul
    name: gemma4_12b.o_proj.dynM
    M: 512
    N: 3840
    K: 4096
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w4x2/f2x4/k2', REDUCE: 'g4k', RASTER: '', STAGE: 'd2/tma/ring', WSPEC: ''}
    emmy_us: 82.1
    cublas_us: 99.8
  - kernel: matmul
    name: gemma4_12b.o_proj.dynM
    M: 512
    N: 3840
    K: 4096
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w4x2/f4x8/k4', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/tma/ring', WSPEC: ''}
    emmy_us: 63.9
    cublas_us: 99.8
  # ---- MLP -------------------------------------------------------------------------------------------
  # mlp_gate_up: the fused gate+up width (2 x 15360 = N 30720) — the shape of the gate/up ⊗-fold channels
  # in the fused RMSNorm→gate⊗up→GeGLU megakernel. Cold greedy on the .dynM twin HANGS (>1 s accuracy
  # probe, bench_fail) — the entry below is what unblocks it.
  - kernel: matmul
    name: gemma4_12b.mlp_gate_up
    M: 512
    N: 30720
    K: 3840
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w4x2/f4x8/k4', REDUCE: '', RASTER: '', STAGE: 'd2/tma/ring', WSPEC: ''}
    emmy_us: 561.7
    cublas_us: 573.3
  - kernel: matmul
    name: gemma4_12b.mlp_gate_up
    M: 512
    N: 30720
    K: 3840
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w4x2/f4x8/k4', REDUCE: '', RASTER: '', STAGE: 'd2/tma/ring', WSPEC: ''}
    emmy_us: 362.4
    cublas_us: 573.3
  - kernel: matmul
    name: gemma4_12b.mlp_gate_up.dynM
    M: 512
    N: 30720
    K: 3840
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w4x2/f4x8/k4', REDUCE: '', RASTER: '', STAGE: 'd2/tma/ring', WSPEC: ''}
    emmy_us: 562.4
    cublas_us: 561.7
  - kernel: matmul
    name: gemma4_12b.mlp_gate_up.dynM
    M: 512
    N: 30720
    K: 3840
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w4x2/f4x8/k4', REDUCE: '', RASTER: '', STAGE: 'd2/tma/ring', WSPEC: ''}
    emmy_us: 362.4
    cublas_us: 561.7
  # mlp_down: deep-K (15360) — the classic f16acc profile; the [fm] entry is 1.34x past cuBLAS.
  - kernel: matmul
    name: gemma4_12b.mlp_down
    M: 512
    N: 3840
    K: 15360
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w4x2/f2x4/k2', REDUCE: 'g4k', RASTER: '', STAGE: 'd2/tma/ring', WSPEC: ''}
    emmy_us: 286.2
    cublas_us: 286.3
  - kernel: matmul
    name: gemma4_12b.mlp_down
    M: 512
    N: 3840
    K: 15360
    dtype: 'fp16'
    knobs: {TILE: 'a:mma_m16n8k16_f16_f16/w4x2/f4x8/k4', REDUCE: 'g2k', RASTER: '', STAGE: 'd2/tma/ring', WSPEC: ''}
    emmy_us: 214.2
    cublas_us: 286.3
  # (2026-07-22, merged-sibling re-record) The sibling-linear concat (WS1) fuses the GeGLU combine
  # cone into the sym down matmul (the merged gate_up workspace read at two N-offsets), so the fork
  # only offers d*/sync computed-A rows — the recorded d2/tma/ring rows (std AND [fm]) could no
  # longer realize (DRIFT). Re-measured on the cone-bearing dyn snippet
  # ((gelu(y[:,:15360]) * y[:,15360:]) @ w, seq_len@y:0): 524.9 + 5.6 finalize = 530.5 vs its own
  # eager 397. cublas_us kept as the plain-matmul reference; the fm dynM anchor awaits the fm-lane
  # reseed (serving A/B session). STAGE is deliberately UNRECORDED: the fork's only transports are
  # the computed-A d*/sync fills, which the plain-matmul stage catalog cannot spell (the permanence
  # test enumerates gmem/cp/tma only) — the TILE+REDUCE prefix is unambiguous on this fork.
  - kernel: matmul
    name: gemma4_12b.mlp_down.dynM
    M: 512
    N: 3840
    K: 15360
    dtype: 'fp16'
    dynamic: true
    knobs: {TILE: 'a:mma_m16n8k16_f16_f32/w1x8/f2x2/k4', REDUCE: 'g4k', RASTER: '', WSPEC: ''}
    emmy_us: 530.5
    cublas_us: 286.3
  # ---- attention (flash, hd256) ----------------------------------------------------------------------
  # Values re-measured 2026-07-13 after the causal tile-skip landed (the triangular kv bound — each CTA
  # streams only min(seq, (grid_m+1)·rows) keys; 3x reproduced, ≤0.3 µs spread): at THIS shape (grid 128
  # CTAs < 170 SMs) the wall is the diagonal-full CTA, so the skip pays 0-6% here but 1.67x at seq 2048
  # (441 → 265 µs, 0.55x → 0.90x vs SDPA) where the grid oversubscribes. Best form moved to the nt=4
  # streaming block (w4x1/f1x4/k16, 32 keys/step): 32.9 µs vs torch SDPA 30.7 — 0.93x, the residual
  # still the hd256 register ceiling (255 regs, 1-2 CTAs/SM). Cold greedy ranks the w2x1/f1x8/k16 form
  # (64 KB slabs, 64-thread CTAs) — a flash-form rank miss (post-skip that row is 35.1, pre-skip 97).
  # PIN-SPELLING CONTRACT for static hd256: BOTH keyed pins must name one enumerated row — TILE@dd is
  # w<um>x1/f<fm>x<nt>/k16 (bk = 256/atom_k) and TILE@pj is w<um>x1/f<fm>x32 (32 = 256/atom_n, its
  # k = block/atom_k elided at 1); a pj spelled like the dd plan matches nothing and the fork falls
  # back to greedy. Transport stays LANE-dependent: the std (f32-acc PV) lane prefers d2/tma/ring, the
  # fm (f16-acc PV) lane d2/cp/ring (nt4 fm: cp 33.9 vs tma 37.2).
  - kernel: attention
    name: gemma4_12b.attention.hd256
    n_heads: 16
    seq: 512
    head_dim: 256
    dtype: 'fp16'
    causal: true
    knobs: {PLACE: 'fuse', STAGE: 'd2/tma/ring', 'TILE@dd': 'a:mma_m16n8k16_f16_f32/w4x1/f1x2/k16', 'TILE@pj': 'a:mma_m16n8k16_f16_f32/w4x1/f1x32', WSPEC: ''}
    emmy_us: 35.5
    cublas_us: 30.7
  # The std-lane PRIMARY (2026-07-14, alternating staging): the 64-key streaming block (nt=8) on
  # d1/cp/alt — one K slab + one V slab, refills interleaved with the phases that no longer read
  # them (cp.async commit-group queue, uniform wait_group(1)), Q staged through smem. The cp
  # transport BEATS the tma sibling here (31.7 vs 32.2 — the lane/transport flip again); 0.97x vs
  # torch SDPA, 3x reproduced. The paired-ring nt=8 form was spill-bound at 55.5. FAST_EXP
  # neutral; alt+g2k 33.3 (the finalize costs more than the split recovers at this grid).
  - kernel: attention
    name: gemma4_12b.attention.hd256
    n_heads: 16
    seq: 512
    head_dim: 256
    dtype: 'fp16'
    causal: true
    knobs: {PLACE: 'fuse', STAGE: 'd1/cp/alt', 'TILE@dd': 'a:mma_m16n8k16_f16_f32/w4x1/f1x8/k16', 'TILE@pj': 'a:mma_m16n8k16_f16_f32/w4x1/f1x32/k4', WSPEC: ''}
    emmy_us: 31.7
    cublas_us: 30.7
  # The tma-alt sibling (0.95x) — kept beside the cp primary (both directions 3x reproduced).
  - kernel: attention
    name: gemma4_12b.attention.hd256
    n_heads: 16
    seq: 512
    head_dim: 256
    dtype: 'fp16'
    causal: true
    knobs: {PLACE: 'fuse', STAGE: 'd1/tma/alt', 'TILE@dd': 'a:mma_m16n8k16_f16_f32/w4x1/f1x8/k16', 'TILE@pj': 'a:mma_m16n8k16_f16_f32/w4x1/f1x32/k4', WSPEC: ''}
    emmy_us: 32.2
    cublas_us: 30.7
  # The FM PRIMARY — and the first emmy-past-torch-SDPA hd256 entry on the 5090: the f16-accumulate
  # PV sibling on d1/cp/alt runs 29.7 = 1.03x vs SDPA 30.7 (3x reproduced zero-spread; on tma-alt
  # the fm promote outweighed at 33.8 — cp's issue pattern absorbs it, the fm-prefers-cp lane rule).
  - kernel: attention
    name: gemma4_12b.attention.hd256
    n_heads: 16
    seq: 512
    head_dim: 256
    dtype: 'fp16'
    causal: true
    knobs: {PLACE: 'fuse', STAGE: 'd1/cp/alt', 'TILE@dd': 'a:mma_m16n8k16_f16_f32/w4x1/f1x8/k16', 'TILE@pj': 'a:mma_m16n8k16_f16_f16/w4x1/f1x32/k4', WSPEC: ''}
    emmy_us: 29.7
    cublas_us: 30.7
  # The paired-ring runner-up: the nt=4 streaming block (32 keys/step, 32 KB slabs) — 32.9, 7% past
  # the nt=2 entry (pre-skip they were parity alternates). The knob frontier ends here — nt=8 fattens
  # to 55 µs, w2x1 forms reach 35.1 (parity with nt=2, no longer the 97 µs hazard), w1x1 38.6,
  # d3 34.0, WSPEC bands nvcc-fail on this kernel. The 0.93x residual vs torch SDPA is per-step
  # PIPELINE DEPTH, not occupancy/registers and not search — refuted 2026-07-13: forcing 3 CTAs/SM
  # (launch_bounds min-blocks, 168 regs + spills) runs 74.6, per-step Q reload 87.5, nt4/d1 (2 CTAs,
  # no prefetch ring) 46.3, and split-KV g2k 34.9 — every occupancy/balance lever loses to the
  # 1-CTA prefetch-ring form. Closing it needs cross-step software pipelining in the emitter (the
  # f2 ILP chains are register-impossible at hd256: 2×128 O-accumulator regs).
  - kernel: attention
    name: gemma4_12b.attention.hd256
    n_heads: 16
    seq: 512
    head_dim: 256
    dtype: 'fp16'
    causal: true
    knobs: {PLACE: 'fuse', STAGE: 'd2/tma/ring', 'TILE@dd': 'a:mma_m16n8k16_f16_f32/w4x1/f1x4/k16', 'TILE@pj': 'a:mma_m16n8k16_f16_f32/w4x1/f1x32/k2', WSPEC: ''}
    emmy_us: 32.9
    cublas_us: 30.7
  # (A second fm sibling — the nt=4 d2/cp/ring PV-f16acc form at 33.9 — was dropped 2026-07-21 by the
  # fm-never-loses invariant: it recorded above the std best (31.7) and the fm cp-alt row (29.7), so
  # the fastest-first picker could never realize it in either lane.)
  # Masked-flash twin: bare TILE (schema-enforced). Cold greedy on this unseeded shape picks a >10 s
  # bench_fail hang — the same hazard the sm_89 cards hit (rtx4080 seeding note). Same geometry and
  # lane-dependent transport as the static twin; d3 / p2 are within noise. Values re-measured post
  # tile-skip (dynM ≈ static parity holds: the symbolic bound folds into the same triangular stop).
  - kernel: attention
    name: gemma4_12b.attention.hd256.dynM
    n_heads: 16
    seq: 512
    head_dim: 256
    dtype: 'fp16'
    causal: true
    dynamic: true
    knobs: {PLACE: 'fuse', STAGE: 'd2/tma/ring', TILE: 'a:mma_m16n8k16_f16_f32/w4x1/f1x2/k16', WSPEC: ''}
    emmy_us: 35.5
    cublas_us: 30.7
  # The faster dynM twin post-tile-skip (3% past nt=2, zero-spread): the nt=4 streaming block,
  # mirroring the static primary.
  - kernel: attention
    name: gemma4_12b.attention.hd256.dynM
    n_heads: 16
    seq: 512
    head_dim: 256
    dtype: 'fp16'
    causal: true
    dynamic: true
    knobs: {PLACE: 'fuse', STAGE: 'd2/tma/ring', TILE: 'a:mma_m16n8k16_f16_f32/w4x1/f1x4/k16', WSPEC: ''}
    emmy_us: 34.4
    cublas_us: 30.7
  # (The fm dynM sibling — d2/cp/ring on the bare f16acc PV-plan TILE spelling, 35.5 — was dropped
  # 2026-07-21 by the fm-never-loses invariant: it recorded above the std dynM best (32.0), so the
  # fastest-first picker could never realize it in either lane. If the fm PV atom is ever wanted here
  # again, note the dd-spelling pin degrades to a >10 s hang — only the PV-plan spelling reproduced.)
  # The dynM PRIMARY (2026-07-14, symbolic-kv alt): the alternating pipeline now resolves on a
  # symbolic kv (the kill-point refill clamps onto the runtime last chunk like the ring prefetch;
  # the staged-Q fill clamp-reads a tail CTA's overhanging query rows, store-guarded) — 32.0 vs the
  # ring twin 34.4, 3x zero-spread, closing most of the dynM-vs-static gap (static std cp-alt 31.7).
  # The geometry/lane preferences FLIP vs static: nt=4 alt (32.0) beats nt=8 alt (32.3; static nt8
  # won), and the fm sibling LOSES on the symbolic form (34.7 — the static fm-alt 29.7 does not
  # transfer), so std stays the dynM primary. tma-alt 35.4 (hd256 prefers cp, as static).
  - kernel: attention
    name: gemma4_12b.attention.hd256.dynM
    n_heads: 16
    seq: 512
    head_dim: 256
    dtype: 'fp16'
    causal: true
    dynamic: true
    knobs: {PLACE: 'fuse', STAGE: 'd1/cp/alt', TILE: 'a:mma_m16n8k16_f16_f32/w4x1/f1x4/k16', WSPEC: ''}
    emmy_us: 32.0
    cublas_us: 30.7
  # ---- norms -----------------------------------------------------------------------------------------
  - kernel: rms_norm
    name: gemma4_12b.rms_norm.k3840
    M: 512
    K: 3840
    knobs: {REDUCE: 'b256'}
    emmy_us: 6.3
    cublas_us: 6.1
  - kernel: rms_norm
    name: gemma4_12b.rms_norm.k3840.dynM
    M: 512
    K: 3840
    dynamic: true
    knobs: {REDUCE: 'b256'}
    emmy_us: 6.3
    cublas_us: 6.1
  # Q/K-norm over head_dim: 512 rows x (16 heads x 256) reshaped to 4096 x 256 (mirrors the rtx4090
  # gemma4_12b.qknorm.k256 entry). Greedy's b256 benches 4.3; b64 / b128 tie at 3.6.
  - kernel: rms_norm
    name: gemma4_12b.qknorm.k256
    M: 4096
    K: 256
    knobs: {REDUCE: 'b64'}
    emmy_us: 3.6
    cublas_us: 4.1
  # The rest of the per-head q/k-norm row counts, seeded 2026-07-19 (3x, 0% spread). The entry above covers only
  # ONE of the eight (rows, head_dim) combinations the model actually runs: rows = tokens x heads, so each of
  # {decode m32, prefill m256} x {q, kv} x {local hd256, global hd512} is a DIFFERENT shape. The mapping:
  #   k256 (local):  m32 kv -> 32x8  =  256 | m32 q -> 32x16  =  512 | m256 kv -> 256x8  = 2048 | m256 q -> 4096 (above)
  #   k512 (global): m32 kv -> 32x1  =   32 | m256 kv -> 256x1 = 256 | m32 q  -> 32x16   =  512 | m256 q -> 4096
  # These are the single highest cold-rescue entries in the file. Unlike the BLOCK norms (rms_norm.k3840, where
  # cold greedy already lands at 6.0 vs a 5.8 pin — deliberately left unseeded, there is nothing to win), cold
  # greedy on the per-head norms picks a pathological reduce and collapses: 112 / 131 / 226 / 263 µs on the four
  # small-row shapes, i.e. 75-125x slower than the pin AND ~30-90x slower than torch. The pins also BEAT torch
  # eager (1.4-2.4 vs 2-4). Swept b64/b128/b256/b512 on every shape: the optimum tracks ROW COUNT, not just the
  # reduce extent — few rows want a wide block (b256/b512 at 32-512 rows), many rows want a narrow one (b128 at
  # 2048-4096), which is why the one recorded 4096-row entry's b64 does not transfer down.
  - kernel: rms_norm
    name: gemma4_12b.qknorm.k256.m256
    M: 256
    K: 256
    knobs: {REDUCE: 'b256'}
    emmy_us: 1.5
    cublas_us: 3.0
  - kernel: rms_norm
    name: gemma4_12b.qknorm.k256.m512
    M: 512
    K: 256
    knobs: {REDUCE: 'b256'}
    emmy_us: 1.6
    cublas_us: 4.0
  - kernel: rms_norm
    name: gemma4_12b.qknorm.k256.m2048
    M: 2048
    K: 256
    knobs: {REDUCE: 'b128'}
    emmy_us: 2.4
    cublas_us: 4.0
  - kernel: rms_norm
    name: gemma4_12b.qknorm.k512.m32
    M: 32
    K: 512
