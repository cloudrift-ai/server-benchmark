    M: 1
    N: 12288
    K: 4096
    dtype: 'trellis'
    k_bits: 4
    cb: 0
    trans_b: true
    knobs: {WORK: 't32', TILE: '', REDUCE: 'g32k/coop-t/r16', STAGE: '', LOOPIFY: '0', RASTER: ''}
