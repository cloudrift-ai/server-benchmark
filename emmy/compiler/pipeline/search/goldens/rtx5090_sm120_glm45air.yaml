# GLM-4.5-Air-exl3 (trellis-coded / EXL3 weights, decoded inside the kernel) on the RTX 5090 —
# seeded 2026-08-07, extended to the full trunk 2026-08-08 by a manual pinned --ab sweep (no
# tuner), and re-measured 2026-08-09 when the warp tier's compute fill moved to the run-fused
# COLUMN decode (see part 2 below: every M > 1 entry got faster and eight of them changed tile).
# Each entry is reproduced 3x. This is the FIRST coded-weight golden file. It now covers
# every DENSE-TRUNK coded projection at the three narrow static widths the generative runner
# deploys at decode (M = 1 / 8 / 32); see the residual notes at the bottom for what is not here
# and — more important — for the one width the sweep MEASURED and then deliberately withheld.
#
# HOW TO READ — L2 RESIDENCY, and it is load-bearing here more than anywhere else.
# `run --bench --golden` replays one kernel over one weight slab ~100x. At 2 bits per weight a
# projection's whole codes slab is TINY: the 4096->11008 entry below streams 11.3 MB of codes,
# which lives in the 5090's 96 MB L2 for the entire bench. A 29 GB trunk in a real step does not.
# So the absolute microseconds here DO NOT predict in-model step time, and neither does the
# vs-uncompressed ratio: the L2-resident shapes measure at rough parity with their f16 twins
# (which are streaming out of L2 at ~4.9 TB/s, a rate no 29 GB model ever sees), while the same
# comparison past L2 shows the compressed form ahead by 3.7x. That parity-vs-win split is the
# concrete reason the past-L2 square entry is in this file at all. Same-shape comparisons (the
# A/B this file is seeded from) stay valid; cross-shape and cross-format ones do not. Judge the
# format end to end — twin / serving latency and the roofline audit — never here.
#
# WHY THESE EXIST, part 1 — the decode band's split width (the M=1 entries). The band partitions
# the contraction across CTAs (`gNk` = N-way cross-CTA split, `coop-t/r16` = 32 lanes sweeping the
# output axis over the tile's 16 register rows), and greedy takes a split 2-6x too narrow on the
# long-K shapes, leaving 15-29% on the table. The optimum is NOT simply "the widest": the split's
# finalize reads a `cta x N` f32 workspace whose bytes over the codes' are `2 / (steps * k_bits)`,
# so it sits at 8-32 tile steps per CTA and moves with how L2-resident the codes are. The two
# 11 MB projections peak at 8 steps (`gate_up` g32k, `down` g86k), the 121 MB square at 32 (g43k),
# and the long-K o_proj at 8 (g96k, 768 tiles / 8).
#
# WHY THESE EXIST, part 2 — the warp tier's OUTPUT TILE (every M > 1 entry), and this is the
# larger correction. Greedy takes a WIDE fragment tile (`f1x4` / `f1x8`): the right answer for a
# materialized B, where a wide tile buys operand reuse. A DECODED B has far less to reuse — the
# decode is ALU work the fragment does not amortize — so a wide tile mostly costs registers, and
# the register pressure caps occupancy at 17-25%. The measured answer is a NARROW output tile with
# as many CTAs as the output axis will give: occupancy goes to 58-92% and the kernel runs 1.0-4.9x
# faster than the cold pick, worst on the narrow-N attention k/v projection (4.9x) and the
# shared-expert gate/up (4.5x). Split-K cannot help here — it is refused on a computed B (no gmem
# index to re-index), so CTA count comes from the output axis alone. Every per-entry `cold pick`
# ratio in the comments below is that comparison, measured 2026-08-08 and not re-run since.
#
# WHAT COUNTS AS "narrow" CHANGED ON 2026-08-09, and the mechanism is worth stating because it will
# move again. Those entries were measured against a fill that decoded PER ELEMENT at 27 SASS
# instructions per 2-bit weight. The fill now decodes a whole tile COLUMN per run — one code fetch
# and one window derivation for 16 k rows, the form the M=1 band already used — at 14. Two
# consequences, both measured here:
#   * every M > 1 entry got **1.16-1.57x faster at its own recorded tile**, with nothing else
#     changed. That is the honest size of the port: the fill's own instruction count fell 1.93x,
#     the whole kernel's 1.53x (33.8 -> 22.1 warp-instructions per weight), and the time 1.31x,
#     because only ~45% of this kernel's time was issue-bound to begin with.
#   * the optimum moved BACK toward the wide end on eight entries, because a cheaper decode is a
#     smaller share of the kernel and operand reuse is a larger one. All eight are REVERSALS: the
#     newly recorded row was measurably SLOWER than the one it replaces under the per-element fill,
#     so none of them is a 2026-08-08 sampling miss dressed up as a move.
#       kv_proj.m8         w2x2/f1x1/k8 -> w1x4/f1x1/k8   1.14x / 1.10x  (0.85x / 0.83x before)
#       shared_gate_up.m8  w2x2/f1x1/k8 -> w1x4/f1x1/k8   1.30x (b3, b4) (0.96x / 0.97x before)
#       mlp_gate_up.m32    w2x2/f1x1/k8 -> w2x2/f1x2/k8   1.04x          (0.95x before)
#       shared_down.m32    w2x2/f1x1/k8 -> w2x4/f1x1/k8   1.06-1.10x     (0.75x before, b2 arm)
#     Each mover's own line below carries both directions. The other 20 entries keep their tile.
# Read the rule as "price the DECODE's instruction count, not the operand traffic" — which way it
# points depends on what a decoded weight costs, and that number is now a moving target.
#
# AND ONE ROW THAT COULD NOT BE RECORDED, which is the workflow lesson of this round.
# `w1x2/f1x1/k16` is the fastest row the re-sweep found at `kv_proj.m8` (25.20 us) and
# `shared_gate_up.m8` (26.21) — another 1.03-1.08x past what is recorded above. It is NOT in this
# file, because the deploy enumeration does not offer it: an explicit `--ab` pin reaches it, greedy
# never does, and a golden greedy cannot match is not inert — it drops the shape to the COLD pick
# (`kv_proj.b4.m8` measured 83.7 us that way, worse than any tile in the ladder). Recording a row
# is therefore gated on the GREEDY number after the edit, not on the pinned number before it.
# Widening the enumeration to offer `w1x2` at `k16` is a compiler change, and is not attempted here.
#
# LANE: measured in the DEFAULT (f32) lane. The f16-pair fold (`EMMY_F16_REDUCE_F32_ACC` / the
# `FAST_MATH` umbrella, `060_pair_decode_accum`) is 13-18% faster on the M=1 band entries and
# picks the SAME split at every one of them; on the warp tier the f16-accumulate atom measured
# within 0.1% of the f32 one at the winning tile (63.3 vs 63.3 us on gate_up.m32, 2026-08-08 — not
# re-measured after the column-run fill, which touches neither lane's accumulate). So one recorded
# schedule serves both lanes and no `[fm]` sibling entry is warranted.
#
# MEASUREMENT METHOD: `emmy run --golden <name> --bench --bench-backends emmy --warmup 10
# --iters 100 --ab "<row>" --ab ...` over a per-width ladder, 3 reps, the median recorded and the
# rep min/max in each comment. The M=1 ladder is the shape's WHOLE offered band
# (`decode_band_moves(K // 16)`); the M > 1 ladders sample the warp grid — 9 pinned rows on
# 2026-08-08, 12 on the 2026-08-09 re-sweep (which added the `k16` and `w2x4` arms). The enumerated
# pool is ~3.8k rows, so this is a sample, not an exhaustive search — see the residuals. Two gates
# on adopting a row that beats the recorded one, both of which caught something this round: it must
# also be measured under the PICK IT REPLACES in the previous codegen state (so a sampling miss is
# never reported as a move), and the GREEDY row must land on it after the edit (so an unreachable
# row is never recorded). `emmy_us` is the SPLIT PAIR's total on the band entries (partial +
# finalize), matching the olmoe file.
# `--bench-backends emmy` is REQUIRED for a coded shape: the eager reference is the numpy
# reference decode (`loader/exl3.decode_trellis`), correct but ~0.7 s per call at 4096x11008, so
# the default eager lane would re-decode once per bench iteration.
#
# cublas_us DEVIATES from the usual convention (the live `Eager PyTorch` row of the same
# `run --bench`), for the reason just given — that row would time the numpy decode. It records
# instead the torch eager f16 row at the SAME extents and layout with uncompressed weights,
# measured separately (10 warmup + 100 CUDA-event-timed `F.linear` calls, median). It answers
# "what would this projection cost if we had shipped it in f16", not "what does cuBLAS do with
# these bytes" — there is no cuBLAS path for coded weights. Every one of those references is
# L2-resident, so a coded entry reading SLOWER than its f16 column is the expected reading at
# these sizes and says nothing about the served model.
#
# BASIS: the recorded shape is the HAT-BASIS contraction at the codes grid's 128-padded extents —
# `F.linear(x, trellis_decode(codes))`, no suh/svh and no Hadamard. That is exactly the
# contraction a served coded linear runs: the activation-side basis restore (VQ Phase 3.3) puts
# `·suh`, both 128-block Hadamards and `·svh` in SEPARATE kernels on either side of it. Verified
# by keying both forms: the golden's `ShapeKey` equals the key the deploy side builds for the
# EXL3-spelled in-model graph, at M=1 and at prefill M (see
# `tests/compiler/passes/test_trellis_computed_b.py`).
#
# CODE RATE: `k_bits` is part of the ShapeKey, so a shape holds one entry PER RATE and the
# 2.25-optimized rung's mixed allocation cannot collide. That is not theoretical here: the pinned
# checkpoint stores q/k/v at 4 bits on 42 layers and 3 on 4, o_proj at 4 on 41 and 3 on 4 (layer
# 0's o_proj is left uncoded fp16), the shared experts at 2 / 3 / 4 across 45 layers, and the one
# dense MLP at 2. Every entry records the rate it was measured at. The op side stamps
# `S_trellis_k_bits` off the decode leaves.
#
# WIDTHS: M is a static width the generative runner deploys — 1 (`EMMY_GEN_M1_TIER`) and 8 / 32
# (`EMMY_GEN_DECODE_BUCKET`; the pinned serving config uses 32). All three are widths
# `emmy/serving/twins.py` traces, which is what makes `eval golden --in-model` able to audit them.
# At every one of them the recorded tile keeps the SAME number of M blocks the shape already had
# (one), so it changes how the decode is parallelized and not how many times the codes are read.
# That is the invariant the prefill width broke — see the residuals.
#
# `model:` HEADER: tagged with the rung's own branch (`<repo>@<revision>`), because the rungs
# differ in exactly the bit allocation the keys carry — auditing 2.25 goldens against the 2.0
# checkpoint would key every shape at 2 bits. `eval golden --in-model` builds the weight-free
# twins from `config.json` + `quantization_config.json` and spells the coded contractions with
# the same speller serving uses, one twin per rate profile. The `pastl2_22016` control shape is
# NOT a model shape, so it opts out with a per-entry `model: null`.
#
# NOT COVERED, with reasons — read the FIRST one before adding a wide-M entry here:
#  * PREFILL WIDTH (M=512, the static chunk twin) and M=64: MEASURED and WITHHELD. Both widths
#    swept clean in isolation (M=512 1.03-1.76x, M=64 2.1-4.5x over greedy) and the M=512 set was
#    then checked in the real programs, where it INVERTED: layer 1's coded o_proj went 711 -> 1182
#    us and the whole `post` chunk twin 1334 -> 1818. The isolated bench cannot rank a wide-M tile
#    here. Both winners cut the CTA's M extent (M=512: 64 rows against greedy's 128, so eight M
#    blocks instead of four; M=64: 32 against 128), which re-reads the codes slab more times and
#    narrows the DRAM stripe — free when the whole slab sits in L2 for a hundred replays, not free
#    against a 29 GB trunk. The M = 1 / 8 / 32 entries do NOT have that property (one M block
#    either way, verified above), and their in-model gain reproduced: 1.7-2.3x per program. A
#    prefill golden needs an in-model or past-L2 measurement, not this harness.
#  * the SYMBOLIC (`.dynM`) coded forks — the masked-tile programs a partial prefill chunk rides.
#    With `--max-num-batched-tokens` 512 a 512-token prompt is one full chunk and takes the static
#    twin, so the symbolic path carries only chunk tails; unswept on that ranking, and it would hit
#    the same wide-M measurement problem.
#  * the warp grid beyond the 9 sampled rows per width. The pool is ~3.8k rows; the sample was
#    built from one full exploration on `mlp_gate_up.m32` and the winner reproduced on 13 more
#    shapes, so the direction is solid but the last few percent is not claimed.
#  * the UNCODED f16 forks of this model — layer 0's fp16 o_proj (4096x12288, 151.7 us in-model at
#    M=32 and untouched by this sweep), the norms, the router, and the fused/pointwise glue.
#  * the M=192 / 256 / 1024 / 2048 / 4096 widths `twins.py` traces for other serving lanes. This
#    deployment runs none of them, and they are wide-M, so the caveat above applies.
#  * the `pastl2_22016` control was not re-measured this round; its 2026-08-07 row stands.
gpu_name: NVIDIA GeForce RTX 5090
# Tagged by commit sha, not the `2.25bpw` branch name: a branch can be re-cut, and the release
# pipeline pins `SERVE_REVISION` to a sha, which the coverage gate compares exactly. The sha below
# is what the `2.25bpw` ref resolved to when these entries were measured.
model: turboderp/GLM-4.5-Air-exl3@6a309ed6d606fc0154e6e1aeb0912cd3c25534fe
compute_cap:
  - 12
  - 0
configs:
