# gpt-oss-20b kernel shapes (hidden 2880, expert intermediate 2880, E=32 top-4, 64 Q / 8 KV heads
# at head_dim 64, biased projections) served at FP8 on the RTX 5090 — seeded 2026-08-07 by a manual
# pinned exploration over the SERVING programs themselves (no tuner), each entry reproduced 2-3x at
# <2% spread. Two families live here:
#
#   - the fp8 EXPERT matmuls (`dtype: fp8`) — the routed expert FFN's gate_up / down, whose weights
#     are per-expert slices of the E-stacked tensors passed as program INPUTS and spelled as fp8
#     bits + per-out-channel scale (`spell_quantized_inputs`). They key with
#     `ShapeKey.dtype_class == "f8"`: a different kernel family from the 16-bit twin at the same
#     extents (half the B bytes, a decode convert in the staging path), so they can never join a
#     dense entry.
#   - the DENSE fp16 projections — q / k / v / o of the attention half, whose fp8 checkpoint
#     weights dequantize to values at load, so the served kernels are ordinary 16-bit contractions.
#
# Layout: gpt-oss stores its expert weights `(E, in, out)` and applies them as `x @ W`, so every
# matmul here is the CANONICAL `(M,K) @ (K,N)` orientation — no `trans_b` twin anywhere (unlike the
# OLMoE file, whose experts are `F.linear`). The dense projections read CONSTANT weights whose
# layout transpose folds at load, which lands them on the same canonical orientation.
#
# Why these exist: cold greedy resolved every gpt-oss shape through the offline prior and lost
# 1.2x-14.7x per kernel. The M=1 gemvs (the c=1 fixed-slot decode path: 24 layers x 4 slots x 2
# expert matmuls + 4 dense projections per step) all deployed the KNOB-LESS SCALAR form — one
# thread per output element, no cooperative reduce — at 57-228 µs each; the transposed coop
# reduce under a grid split-K (`g8k/coop-t`) lands them at the weight-streaming floor. The
# decode-bucket and prefill expert twins lost even harder (the M=256 expert down at 23.3 ms).
#
# `emmy_us` is the SERVING kernel's own time, measured per launch inside the program the runner
# builds (`benchmark_program` per-launch medians); a split-K entry records the split pair's total
# (main + finalize). `cublas_us` is torch eager `matmul` at the same extents in fp16 — for the fp8
# rows that is deliberately the 16-BIT compute baseline (what a 16-bit engine pays for the same
# contraction), not a dequant-then-HGEMM chain: a W8A16 kernel reads half the weight bytes, and
# beating HGEMM at decode widths is exactly the claim the fp8 lane makes.
#
# NOT recorded, deliberately (greedy already wins — see plans/moe-support.md's M4-prep findings):
# rms_norm at k=2880 (m1 6.2 / m16 8.2 / dynM 6.2 µs; every cooperative pin measured 12-30x worse
# because the pin lands on the norm's own reduce), and the symbolic expert `down` (t128/coop-t is
# 2.8-5.4% under greedy across two widths — below the reproducible-win bar).
#
# std lane only: at these memory-bound widths the f16-accumulate atoms don't pay, so no [fm]
# siblings were recorded.
gpu_name: NVIDIA GeForce RTX 5090
model: openai/gpt-oss-20b
compute_cap:
  - 12
  - 0
configs:
  # ---- fp8 expert FFN, M=1 (the fixed-slot c=1 decode path — 96 launches per step) ------------
  # Both greedy picks were the knob-less scalar form (80.5 / 228.3 µs). The transposed block coop
  # under a grid split-K is the gemv shape here: 8 grid slices x a 128/256-wide transposed block
  # reduce streams the fp8 weight slab coalesced. gate_up prefers the narrower block (more slabs
  # in flight over N=5760), down the wider one with twice the grid split.
  - kernel: matmul
    name: gptoss20b.expert_gate_up.m1
    M: 1
    N: 5760
    K: 2880
    dtype: 'fp8'
    knobs: {WORK: 't128', TILE: '', REDUCE: 'g8k/coop-t', STAGE: '', LOOPIFY: '0', RASTER: ''}
    emmy_us: 13.5
    cublas_us: 29.1
  - kernel: matmul
    name: gptoss20b.expert_down.m1
    M: 1
    N: 2880
    K: 2880
    dtype: 'fp8'
    knobs: {WORK: 't256', TILE: '', REDUCE: 'g16k/coop-t', STAGE: '', LOOPIFY: '0', RASTER: ''}
    emmy_us: 15.6
    cublas_us: 19.1
  # ---- fp8 expert FFN, M=16 (the decode-bucket twin — routed row sets of 2..16) ----------------
  # gate_up reaches the warp mma tier; its greedy pick was a ONE-warp CTA (w1x1) at 12% occupancy.
  # down CANNOT reach the warp tier at all — its A operand is the clamped-SwiGLU cone fused out of
  # gate_up's epilogue, and a computed-A cone over strided chunk halves declines the staged
  # transports, so every warp pin falls back to the scalar family (verified: TILE/WORK/STAGE
  # realize `off` on that node under a whole-program pin). The recorded entry is the best SCALAR
  # member; the true optimum needs the fusion legality fix, not a knob (a plain-A twin of the same
  # extents runs 15.8 µs).
  - kernel: matmul
    name: gptoss20b.expert_gate_up.m16
    M: 16
    N: 5760
    K: 2880
    dtype: 'fp8'
    knobs: {WORK: 'w1x4', TILE: 'mma_m16n8k16_f16_f32/f1x1/k4', REDUCE: '', STAGE: 'd4/tma', LOOPIFY: '0', RASTER: ''}
    emmy_us: 16.4
    cublas_us: 23.3
  - kernel: matmul
    name: gptoss20b.expert_down.m16
    M: 16
    N: 2880
    K: 2880
    dtype: 'fp8'
    knobs: {WORK: 't128', TILE: '', REDUCE: 'g8k/coop-t', STAGE: '', LOOPIFY: '0', RASTER: ''}
    emmy_us: 129.5
    cublas_us: 17.1
  # ---- fp8 expert FFN, M=256 (the prefill twin — the mean per-expert chunk width) --------------
  # Same split as M=16: gate_up on the warp tier, down locked to the scalar family by the
  # computed-A cone (greedy 23.3 ms — the single worst cold pick in the model).
  - kernel: matmul
    name: gptoss20b.expert_gate_up.m256
    M: 256
    N: 5760
    K: 2880
    dtype: 'fp8'
    knobs: {WORK: 'w2x4', TILE: 'mma_m16n8k16_f16_f32/f2x2/k4', REDUCE: '', STAGE: 'd2/tma', LOOPIFY: '0', RASTER: ''}
    emmy_us: 86.8
    cublas_us: 82.5
  - kernel: matmul
    name: gptoss20b.expert_down.m256
    M: 256
    N: 2880
    K: 2880
    dtype: 'fp8'
    knobs: {WORK: 't128', TILE: '', REDUCE: 'coop-t', STAGE: '', LOOPIFY: '0', RASTER: ''}
    emmy_us: 1905.3
    cublas_us: 45.3
  # ---- fp8 expert gate_up, symbolic (.dynM) — routed row sets past the M=256 twin -------------
  - kernel: matmul
    name: gptoss20b.expert_gate_up.dynM
    M: 512
    N: 5760
    K: 2880
    dtype: 'fp8'
    dynamic: true
    knobs: {WORK: 'w2x4', TILE: 'mma_m16n8k16_f16_f32/f2x2/k4', REDUCE: '', STAGE: 'd2/tma', LOOPIFY: '0', RASTER: ''}
    emmy_us: 123.7
    cublas_us: 127.7
  # ---- dense projections, M=1 (the T=1 decode twins: L*.pre.m1 / L*.post.m1) ------------------
  # All three greedy picks were the knob-less scalar gemv (57.6-84.6 µs). One entry covers k_proj
  # and v_proj (identical extents, one shared kernel).
  - kernel: matmul
    name: gptoss20b.q_proj.m1
    M: 1
    N: 4096
    K: 2880
    dtype: 'fp16'
    knobs: {WORK: 't128', TILE: '', REDUCE: 'g8k/coop-t', STAGE: '', LOOPIFY: '0', RASTER: ''}
    emmy_us: 11.5
    cublas_us: 27.4
  - kernel: matmul
    name: gptoss20b.kv_proj.m1
    M: 1
    N: 512
    K: 2880
    dtype: 'fp16'
    knobs: {WORK: 't128', TILE: '', REDUCE: 'g8k/coop-t', STAGE: '', LOOPIFY: '0', RASTER: ''}
    emmy_us: 7.4
    cublas_us: 10.9
  - kernel: matmul
    name: gptoss20b.o_proj.m1
    M: 1
    N: 2880
    K: 4096
    dtype: 'fp16'
    knobs: {WORK: 't128', TILE: '', REDUCE: 'g8k/coop-t', STAGE: '', LOOPIFY: '0', RASTER: ''}
    emmy_us: 11.5
    cublas_us: 23.2
  # ---- dense projections, M=16 (EMMY_GEN_DECODE_BUCKET=16) ------------------------------------
  # Greedy deployed the w1x1 one-warp CTA plus a split-K finalize on every one of them; the 4-warp
  # column band without the split more than covers the finalize it drops. q takes the deeper
  # pipeline (d4), the narrow k/v band and o_proj d2.
  - kernel: matmul
    name: gptoss20b.q_proj.m16
    M: 16
    N: 4096
    K: 2880
    dtype: 'fp16'
    knobs: {WORK: 'w1x4', TILE: 'mma_m16n8k16_f16_f32/f1x1/k4', REDUCE: '', STAGE: 'd4/tma', LOOPIFY: '0', RASTER: ''}
    emmy_us: 12.4
    cublas_us: 17.1
  - kernel: matmul
    name: gptoss20b.kv_proj.m16
    M: 16
    N: 512
    K: 2880
    dtype: 'fp16'
    knobs: {WORK: 'w1x4', TILE: 'mma_m16n8k16_f16_f32/f1x1/k4', REDUCE: '', STAGE: 'd2/tma', LOOPIFY: '0', RASTER: ''}
    emmy_us: 10.3
    cublas_us: 12.9
  - kernel: matmul
    name: gptoss20b.o_proj.m16
    M: 16
    N: 2880
    K: 4096
    dtype: 'fp16'
    knobs: {WORK: 'w1x4', TILE: 'mma_m16n8k16_f16_f32/f1x1/k4', REDUCE: '', STAGE: 'd2/tma', LOOPIFY: '0', RASTER: ''}
    emmy_us: 14.4
    cublas_us: 20.8
  # ---- dense projections, symbolic (.dynM) — the prefill path (EMMY_GEN_PREFILL_BUCKET=0) -----
  # The narrow k/v projection was the worst symbolic pick in the model (202.8 µs at the 512-row
  # hint — 8x its own q sibling, which is 8x WIDER): the masked-tile grid the hint shapes is wrong
  # for N=512. One 2x4-warp band with a 2x2 register tile fixes all three.
  - kernel: matmul
    name: gptoss20b.q_proj.dynM
    M: 512
    N: 4096
    K: 2880
    dtype: 'fp16'
    dynamic: true
    knobs: {WORK: 'w2x4', TILE: 'mma_m16n8k16_f16_f32/f2x2/k4', REDUCE: '', STAGE: 'd2/tma', LOOPIFY: '0', RASTER: ''}
    emmy_us: 81.9
    cublas_us: 82.7
  - kernel: matmul
    name: gptoss20b.kv_proj.dynM
    M: 512
    N: 512
    K: 2880
    dtype: 'fp16'
    dynamic: true
    knobs: {WORK: 'w2x4', TILE: 'mma_m16n8k16_f16_f32/f2x2/k4', REDUCE: '', STAGE: 'd2/tma', LOOPIFY: '0', RASTER: ''}
    emmy_us: 24.7
    cublas_us: 20.9
  - kernel: matmul
    name: gptoss20b.o_proj.dynM
    M: 512
    N: 2880
    K: 4096
    dtype: 'fp16'
    dynamic: true
    knobs: {WORK: 'w2x4', TILE: 'mma_m16n8k16_f16_f32/f2x2/k4', REDUCE: '', STAGE: 'd2/tma', LOOPIFY: '0', RASTER: ''}
    emmy_us: 89.8
    cublas_us: 87.7
