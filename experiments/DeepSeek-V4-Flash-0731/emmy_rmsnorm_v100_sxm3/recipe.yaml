# Build docker/1cat-vllm-sm70/Dockerfile.emmy as the local image below before running this bounded compiler-coverage
# experiment. The maintained serving recipe remains the published stock control until the derived image is approved.
model:
  huggingface: "deepseek-ai/DeepSeek-V4-Flash-0731"
  revision: 7872f01b1d1fe23eabc4c98b48bffcef5a386062
  task: generate

engine:
  llm:
    tensor_parallel_size: 8
    pipeline_parallel_size: 2
    gpu_memory_utilization: 0.90
    context_length: 1048576
    max_concurrent_requests: 8
    vllm:
      image: "emmy/1cat-vllm-deepseek-v4-flash-0731:local"
      extra_args: >-
        --dtype half
        --distributed-executor-backend mp
        --kv-cache-dtype fp8
        --block-size 256
        --max-num-batched-tokens 4096
        --tokenizer-mode deepseek_v4
        --reasoning-parser deepseek_v4
        --tool-call-parser deepseek_v4
        --enable-auto-tool-choice
      extra_env:
        EMMY_ONECAT_RMS_NORM: "1"
        VLLM_SM70_FLASH_ATTN_V100: "1"
        VLLM_SM70_FP8_TURBOMIND: "1"
        VLLM_SM70_MXFP4_TURBOMIND: "1"
        VLLM_SM70_MXFP4_TUNE_SMALL_SHAPES: "0"
        VLLM_SM70_QUANT_BACKEND: "turbomind"
        VLLM_SM70_QWEN_GDN_DISABLE_FULL_FORWARD: "0"
        VLLM_SM70_QWEN_GDN_FULL_FORWARD: "0"
        VLLM_SM70_QWEN_GDN_SPEC_CORE_OP: "0"

benchmark:
  max_concurrency: 8
  num_prompts: 8
  random_input_len: 1024
  random_output_len: 64
  seed: 731
  temperature: 0.0
  ignore_eos: true
  num_warmups: 8
  repeats: 4

matrices:
  deploy.gpu: "NVIDIA Tesla V100 SXM3 32GB"
  deploy.gpu_count: 16
