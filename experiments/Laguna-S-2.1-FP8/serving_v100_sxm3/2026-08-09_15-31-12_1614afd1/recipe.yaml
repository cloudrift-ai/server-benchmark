# Volta qualification for the exact public FP8 checkpoint on 8x V100 SXM3 32GB. The pinned 1Cat
# engine adds LagunaForCausalLM, SM70 block-FP8 TurboMind MoE, and FLASH_ATTN_V100 support.
model:
  huggingface: "poolside/Laguna-S-2.1-FP8"
  task: generate

engine:
  llm:
    tensor_parallel_size: 8
    pipeline_parallel_size: 1
    gpu_memory_utilization: 0.90
    context_length: 4096
    max_concurrent_requests: 1
    vllm:
      image: "cloudriftai/1cat-vllm-sm70:1.2.2-cloudrift"
      extra_args: '--revision 9e0b8ba630080b0e6f20a7b43294a9f2232fd247 --dtype half
        --attention-backend FLASH_ATTN_V100 --max-num-batched-tokens 1024 --enforce-eager
        --disable-custom-all-reduce --enable-auto-tool-choice --tool-call-parser poolside_v1
        --reasoning-parser poolside_v1 --default-chat-template-kwargs ''{"enable_thinking": true}'''
      extra_env:
        VLLM_SM70_FLASH_ATTN_V100: "1"
        VLLM_SM70_FP8_TURBOMIND: "0"
        VLLM_SM70_FP8_MOE_DEQUANT_FALLBACK: "1"
        VLLM_SM70_FP8_MOE_BATCHED_GEMM: "0"

benchmark:
  max_concurrency: 1
  num_prompts: 1
  random_input_len: 32
  random_output_len: 16
  seed: 0
  temperature: 0.0

matrices:
  deploy.gpu: "NVIDIA Tesla V100 SXM3 32GB"
  deploy.gpu_count: 8
