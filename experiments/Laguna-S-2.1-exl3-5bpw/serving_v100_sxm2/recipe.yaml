# Reproduce the final highest-precision V100 recipe with four warm-ups and three steady single-stream runs.
model:
  huggingface: "turboderp/Laguna-S-2.1-exl3"
  revision: 3469659b2f9a1656805250880c6ea9760f9626ed
  task: generate

engine:
  llm:
    tensor_parallel_size: 1
    pipeline_parallel_size: 8
    context_length: 262144
    max_concurrent_requests: 1
    gpu_memory_utilization: 0.84
    vllm:
      image: "emmy-round2-laguna5-v100:f81bbe18"
      extra_args: >-
        --runner generate
        --dtype float16
        --generation-config vllm
        --hf-overrides '{"architectures":["EmmyGenModel"],"quantization_config":null}'
        --enable-auto-tool-choice
        --tool-call-parser poolside_v1
        --reasoning-parser poolside_v1
        --max-num-batched-tokens 16
        --enforce-eager
        --no-enable-prefix-caching
      extra_env:
        EMMY_FAST_MATH: "0"
        EMMY_PACK_DIR: "/opt/emmy/pack"
        EMMY_GEN_DECODE_BUCKET: "16"
        EMMY_GEN_PREFILL_CAPACITY: "16"
        EMMY_GEN_PREFILL_BUCKET: "0"
        EMMY_GEN_M1_TIER: "1"
        PYTORCH_ALLOC_CONF: "expandable_segments:True"
        PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

benchmark:
  random_input_len: 64
  random_output_len: 16
  max_concurrency: 1
  num_prompts: 4
  num_warmups: 4
  seed: 0
  temperature: 0
  ignore_eos: true
  repeats: 3

matrices:
  deploy.gpu: "NVIDIA Tesla V100 SXM2 16GB"
  deploy.gpu_count: 8
