# Per-kernel benchmark of the gemma-4-12B golden set on the RTX 4090 (sm_89: no TMA, all
# staged kernels ride cp.async) — emmy's greedy deploy pick vs eager PyTorch and
# torch.compile, in both precision lanes (standard and EMMY_FAST_MATH=1).
#
# Backs the RTX 4090 per-kernel table in the "Optimizing Gemma4 12B for RTX GPUs" blog
# article (full-precision gemma-4-12B does not fit in 24 GB, so the 4090 section is
# per-kernel only). Same harness as kernels_rtx5090 — see that recipe for details.
#
# Repro on a pre-allocated card (no cloud provisioning):
#   emmy bench experiments/gemma-4-12B/kernels_rtx4090 --ssh user@host
command:
  stage:
    - emmy
    - scripts
    - pyproject.toml
    - requirements.txt
    - Makefile
  run: |
    export PATH=/usr/local/cuda/bin:$$PATH
    cd $repo_dir
    [ -d venv ] || make setup
    ./venv/bin/python scripts/bench_golden_set.py --filter gemma4_12b \
      --backends eager,tcompile,emmy --out-dir $task_dir/std
    EMMY_FAST_MATH=1 ./venv/bin/python scripts/bench_golden_set.py --filter gemma4_12b \
      --backends eager,tcompile,emmy --out-dir $task_dir/fm
  result_files:
    - "std/*"
    - "fm/*"
  timeout: 21600

matrices:
  - deploy.gpu: "NVIDIA GeForce RTX 4090"
    deploy.gpu_count: 1
