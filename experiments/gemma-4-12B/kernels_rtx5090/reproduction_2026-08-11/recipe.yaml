command:
  stage:
    - emmy
    - scripts
    - pyproject.toml
    - requirements.txt
    - Makefile
  run: |
    export PATH=/usr/local/cuda/bin:$$PATH
    cd $repo_dir
    [ -d venv ] || make setup
    ./venv/bin/python scripts/bench_golden_set.py --filter gemma4_12b.mlp_geglu \
      --backends eager,tcompile,emmy --out-dir $task_dir/std
    EMMY_FAST_MATH=1 ./venv/bin/python scripts/bench_golden_set.py --filter gemma4_12b.mlp_geglu \
      --backends eager,tcompile,emmy --out-dir $task_dir/fm
  result_files:
    - "std/*"
    - "fm/*"
  timeout: 3600

matrices:
  deploy.gpu: "NVIDIA GeForce RTX 5090"
  deploy.gpu_count: 1
