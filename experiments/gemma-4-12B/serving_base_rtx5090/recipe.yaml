# The five published Gemma 4 RTX workloads, rerun against the exact base checkpoint and the
# final Emmy FAST_MATH image. This is an engine-only reproduction: it retains no stock lane
# and writes no result artifacts into the repository.
model:
  huggingface: "google/gemma-4-12B"
  revision: 023679ed352de9bb66cc873c9009ce3482585c08
  smoke_test: completion

engine:
  llm:
    tensor_parallel_size: 1
    context_length: 131072
    max_concurrent_requests: 64
    gpu_memory_utilization: 0.96
    vllm:
      image: "cloudriftai/vllm-emmy-gemma-4-12b:0.23.0-5208dcf6"
      extra_args: >-
        --runner generate
        --dtype float16
        --hf-overrides '{"architectures":["EmmyGenModel"]}'
        --max-num-batched-tokens 4128
        --no-enable-prefix-caching
      extra_env: "EMMY_FAST_MATH=1 EMMY_GEN_DECODE_BUCKET=32 VLLM_USE_V2_MODEL_RUNNER=1"

benchmark:
  seed: 0
  temperature: 0
  ignore_eos: true

matrices:
  zip:
    deploy.gpu: "NVIDIA GeForce RTX 5090"
    deploy.gpu_count: 1
    engine.llm.vllm.extra_args:
      - >-
        --runner generate --dtype float16 --hf-overrides '{"architectures":["EmmyGenModel"]}'
        --max-num-batched-tokens 4128 --no-enable-prefix-caching
      - >-
        --runner generate --dtype float16 --hf-overrides '{"architectures":["EmmyGenModel"]}'
        --max-num-batched-tokens 2056 --no-enable-prefix-caching
      - >-
        --runner generate --dtype float16 --hf-overrides '{"architectures":["EmmyGenModel"]}'
        --max-num-batched-tokens 2056 --no-enable-prefix-caching
      - >-
        --runner generate --dtype float16 --hf-overrides '{"architectures":["EmmyGenModel"]}'
        --max-num-batched-tokens 4104 --no-enable-prefix-caching
      - >-
        --runner generate --dtype float16 --hf-overrides '{"architectures":["EmmyGenModel"]}'
        --max-num-batched-tokens 2112 --no-enable-prefix-caching
    engine.llm.vllm.extra_env:
      - "EMMY_FAST_MATH=1 EMMY_GEN_DECODE_BUCKET=32 VLLM_USE_V2_MODEL_RUNNER=1"
      - "EMMY_FAST_MATH=1 EMMY_GEN_DECODE_BUCKET=8 EMMY_GEN_PREFILL_BUCKET=2048 VLLM_USE_V2_MODEL_RUNNER=1"
      - "EMMY_FAST_MATH=1 EMMY_GEN_DECODE_BUCKET=8 EMMY_GEN_PREFILL_BUCKET=2048 VLLM_USE_V2_MODEL_RUNNER=1"
      - "EMMY_FAST_MATH=1 EMMY_GEN_DECODE_BUCKET=8 VLLM_USE_V2_MODEL_RUNNER=1"
      - "EMMY_FAST_MATH=1 EMMY_GEN_DECODE_BUCKET=64 EMMY_GEN_PREFILL_BUCKET=2048 VLLM_USE_V2_MODEL_RUNNER=1"
    benchmark.random_input_len: [4096, 4096, 4096, 8192, 256]
    benchmark.random_output_len: [4096, 4096, 4096, 256, 256]
    benchmark.max_concurrency: [1, 4, 8, 4, 64]
    benchmark.num_prompts: [8, 32, 64, 16, 256]
    benchmark.repeats: [3, 1, 1, 1, 1]
