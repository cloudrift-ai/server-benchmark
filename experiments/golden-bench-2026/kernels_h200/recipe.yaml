# Common model-derived kernel corpus on Hopper. Eight homogeneous devices parallelize candidate measurements.
command:
  stage:
    - emmy
    - pyproject.toml
    - requirements.txt
    - Makefile
    - scripts/verify_working_golden_winners.py
    - scripts/verify_working_golden_greedy.py
    - scripts/capture_kernel_environment.py
    - scripts/verify_staged_source.py
    - scripts/run_submission_kernel_case.sh
    - experiments/golden-bench-2026
  run: |
    set -uo pipefail
    export PATH=/usr/local/cuda/bin:$$PATH
    cd $repo_dir
    source_manifest="$repo_dir/experiments/golden-bench-2026/SOURCE_MANIFEST.json"
    PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_staged_source.py "$source_manifest" --root "$repo_dir" || exit $$?
    export SOURCE_MANIFEST="$$source_manifest"
    [ -d venv ] || make setup
    ./venv/bin/pip install "hidet==0.6.1" || true
    overall_status=0
    for seq_len in 1 512; do
      seq_dir="$task_dir/seq-$$seq_len"
      bash scripts/run_submission_kernel_case.sh "$$seq_dir" \
        Qwen/Qwen3-0.6B@c1899de289a04d12100db370d81485cdf75e47ca 0 "$$seq_len" 12 4 0 \
        "$gpu_device_ids" default hidet || overall_status=1
    done
    exit "$$overall_status"
  result_files:
    - "seq-*/artifacts.tar.gz"
  timeout: 43200

matrices:
  deploy.gpu: "NVIDIA H200 141GB"
  deploy.gpu_count: 8
