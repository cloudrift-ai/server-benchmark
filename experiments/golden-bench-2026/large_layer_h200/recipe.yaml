# Unsharded BF16 model-derived shape-stress corpus. Layers 0 and 3 are the deterministic linear-attention and
# full-attention profiles in Qwen3.6-27B; this is not TP8 or serving-representative evidence.
command:
  stage:
    - emmy
    - pyproject.toml
    - requirements.txt
    - Makefile
    - scripts/verify_working_golden_winners.py
    - scripts/verify_working_golden_greedy.py
    - scripts/capture_kernel_environment.py
    - scripts/verify_staged_source.py
    - scripts/run_submission_kernel_case.sh
    - experiments/golden-bench-2026
  run: |
    set -uo pipefail
    export PATH=/usr/local/cuda/bin:$$PATH
    cd $repo_dir
    source_manifest="$repo_dir/experiments/golden-bench-2026/SOURCE_MANIFEST.json"
    PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_staged_source.py "$source_manifest" --root "$repo_dir" || exit $$?
    export SOURCE_MANIFEST="$$source_manifest"
    [ -d venv ] || make setup
    overall_status=0
    for layer in 0 3; do
      for seq_len in 1 512; do
        case_dir="$task_dir/layer-$$layer-seq-$$seq_len"
        bash scripts/run_submission_kernel_case.sh "$$case_dir" \
          Qwen/Qwen3.6-27B@6a9e13bd6fc8f0983b9b99948120bc37f49c13e9 "$$layer" "$$seq_len" 8 3 0 \
          "$gpu_device_ids" loop-targets none || overall_status=1
      done
    done
    exit "$$overall_status"
  result_files:
    - "layer-*-seq-*/artifacts.tar.gz"
  timeout: 86400

matrices:
  deploy.gpu: "NVIDIA H200 141GB"
  deploy.gpu_count: 8
