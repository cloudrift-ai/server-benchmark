# Datacenter TP4 qualification for DeepSeek-V4-Flash. The image digest and checkpoint are pinned. Add an Emmy engine
# arm, or present this only as platform characterization beside the H200 kernel table.
model:
  huggingface: "deepseek-ai/DeepSeek-V4-Flash"
  revision: 60d8d70770c6776ff598c94bb586a859a38244f1
  task: generate

engine:
  llm:
    tensor_parallel_size: 4
    pipeline_parallel_size: 1
    gpu_memory_utilization: 0.92
    context_length: 262144
    max_concurrent_requests: 32
    vllm:
      image: "vllm/vllm-openai@sha256:03768d9400bf490934e5dce2e9d8ddd9e004a5054939e14641188d8a9b69db8e"
      extra_args: >-
        --kv-cache-dtype fp8 --block-size 256 --tokenizer-mode deepseek_v4 --enable-auto-tool-choice
        --tool-call-parser deepseek_v4 --reasoning-parser deepseek_v4

benchmark:
  seed: 0
  temperature: 0
  ignore_eos: true
  repeats: 3

matrices:
  - deploy.gpu: "NVIDIA H200 141GB"
    deploy.gpu_count: 4
    zip:
      benchmark.random_input_len: [256, 8192, 32768]
      benchmark.random_output_len: [256, 256, 1024]
      benchmark.max_concurrency: [32, 16, 1]
      benchmark.num_prompts: [128, 64, 6]
