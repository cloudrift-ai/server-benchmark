# Provisional RTX 5090 NVFP4 qualification. Replace the nightly image with its measured digest and prove native
# SM120 FP4 execution from logs and generated code; a Marlin fallback is not an NVFP4 performance result.
model:
  huggingface: "nvidia/Qwen3.6-27B-NVFP4"
  revision: 0893e1606ff3d5f97a441f405d5fc541a6bdf404
  task: generate

engine:
  llm:
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    gpu_memory_utilization: 0.92
    context_length: 32768
    max_concurrent_requests: 8
    vllm:
      image: "vllm/vllm-openai:nightly"
      extra_args: >-
        --quantization modelopt --language-model-only --enable-auto-tool-choice
        --tool-call-parser qwen3_coder --reasoning-parser qwen3

benchmark:
  seed: 0
  temperature: 0
  ignore_eos: true
  repeats: 3

matrices:
  - deploy.gpu: "NVIDIA GeForce RTX 5090"
    deploy.gpu_count: 1
    zip:
      benchmark.random_input_len: [128, 4096, 16384]
      benchmark.random_output_len: [128, 1024, 256]
      benchmark.max_concurrency: [8, 4, 1]
      benchmark.num_prompts: [64, 24, 6]
