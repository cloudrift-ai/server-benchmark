# Recent 27B model that fits the RTX 4090 in W4A16. This is a stock system qualification and must not be described
# as an Emmy end-to-end speedup by itself.
#
# Qwen3.8-27B is a hybrid checkpoint: 48 of its 64 layers are Gated DeltaNet linear attention and 16 are full
# attention. The linear-attention path does not lower, so no Emmy arm can exist for this row yet; see the model's
# onboarding report for where it now stops.
#
# The pinned image is a vLLM nightly rather than the `qwen38` release tag: that tag predates this checkpoint revision
# and fails to build the tokenizer backend inside the engine process.
model:
  huggingface: "philbert440/Qwen3.8-27B-W4A16-AWQ"
  revision: 7908d42a71077a5e4dc458f273682b12dfe384a0
  task: generate

engine:
  llm:
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    gpu_memory_utilization: 0.95
    context_length: 8192
    max_concurrent_requests: 8
    vllm:
      image: "vllm/vllm-openai@sha256:dae7af23ea9b66b4f15de3d5e4ddebfdafa7be636be91d400184c1666f1b1462"
      extra_args: >-
        --language-model-only --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3
        --no-enable-prefix-caching

benchmark:
  seed: 0
  temperature: 0
  ignore_eos: true

matrices:
  - cross:
      deploy.gpu: "NVIDIA GeForce RTX 4090"
      deploy.gpu_count: 1
      repeat: [0, 1, 2, 3, 4]
      zip:
        benchmark.random_input_len: [128, 1024, 4096]
        benchmark.random_output_len: [128, 256, 1024]
        benchmark.max_concurrency: [8, 4, 1]
        benchmark.num_prompts: [64, 24, 8]
