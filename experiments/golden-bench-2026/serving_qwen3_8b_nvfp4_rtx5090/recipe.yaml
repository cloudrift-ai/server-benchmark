# Native W4A4 NVFP4 qualification for one RTX 5090. The exact checkpoint declares 4-bit weights and activations for
# every transformer Linear; runtime logs must prove an optimized NVFP4 GEMM and reject Marlin or emulation.
model:
  huggingface: "nvidia/Qwen3-8B-NVFP4"
  revision: ccd10a893cbca613259517c3efe08e151ddf2b8e
  task: generate

engine:
  llm:
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    gpu_memory_utilization: 0.92
    context_length: 32768
    max_concurrent_requests: 8
    vllm:
      image: "vllm/vllm-openai@sha256:6d8429e38e3747723ca07ee1b17972e09bb9c51c4032b266f24fb1cc3b22ed8f"
      extra_args: >-
        --quantization modelopt --no-enable-prefix-caching

benchmark:
  seed: 0
  temperature: 0
  ignore_eos: true
  repeats: 1
  require_complete_requests: true
  required_server_log_patterns:
    - '(?i)Detected ModelOpt NVFP4 checkpoint \(quant_algo=NVFP4\)'
    - '(?i)Using (FlashInfer(Cutlass|B12x|Trtllm|Cudnn)NvFp4LinearKernel|CutlassNvFp4LinearKernel) for NVFP4 GEMM'
  forbidden_server_log_patterns:
    - '(?i)(MarlinNvFp4LinearKernel|EmulationNvFp4LinearKernel|fallback|emulat)'

matrices:
  - cross:
      deploy.gpu: "NVIDIA GeForce RTX 5090"
      deploy.gpu_count: 1
      benchmark.process_repeat: [0, 1, 2, 3, 4]
      zip:
        benchmark.random_input_len: [128, 4096, 16384]
        benchmark.random_output_len: [128, 1024, 256]
        benchmark.max_concurrency: [8, 4, 1]
        benchmark.num_prompts: [64, 24, 6]
