# Frozen serving workload for an NVLink-qualified 16xV100 host. The three points are
# deterministic single-stream measurements; benchmark.repeats preserves three raw repetitions in
# Emmy's JSON. Publication requires build_volta_article_manifest.py --phase 2 --final.
model:
  huggingface: "Qwen/Qwen3.5-122B-A10B"
  task: generate

engine:
  llm:
    tensor_parallel_size: 2
    pipeline_parallel_size: 8
    gpu_memory_utilization: 0.88
    context_length: 32768
    max_concurrent_requests: 1
    vllm:
      image: "cloudriftai/1cat-vllm-sm70:1.2.2-cloudrift"
      extra_args: >-
        --dtype half
        --revision dc4d348443bc740c68e2d77492492c11606384d5
        --language-model-only
        --attention-backend FLASH_ATTN_V100
        --mamba-cache-mode align
        --max-num-batched-tokens 4096
        --enforce-eager
        --enable-auto-tool-choice
        --tool-call-parser qwen3_coder
        --reasoning-parser qwen3
      extra_env:
        VLLM_SM70_ENABLE_DENSE_F16_FASTPATH: "0"
        VLLM_SM70_FLASHQLA_ORIGINAL_PREFILL: "0"
        VLLM_SM70_UNQUANTIZED_MOE_0DOT3_CONFIG: "1"
        VLLM_SM70_UNQUANTIZED_MOE_0DOT3_FUNCTIONAL: "0"

benchmark:
  max_concurrency: 1
  num_prompts: 1
  random_input_len: 32
  random_output_len: 256
  seed: 0
  temperature: 0.0
  ignore_eos: true
  repeats: 3

# Short decode, 4K/256, and a near-32K prompt with 512 tokens of context headroom.
matrices:
  deploy.gpu: "NVIDIA Tesla V100 SXM3 32GB"
  deploy.gpu_count: 16
  benchmark.random_input_len: [32, 4096, 32000]
  benchmark.random_output_len: [256, 256, 256]
