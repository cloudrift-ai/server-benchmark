# Manual-shard fallback for the single-shape-at-a-time golden dataset tuner. Each process owns
# one V100, tuning every sixteenth exact name with isolated DB, online-prior, cubin, and log files.
command:
  stage:
    - emmy
    - pyproject.toml
  run: |
    set -euo pipefail
    mkdir -p $task_dir/cubins $task_dir/locks
    repo_path=$$(realpath $repo_dir)
    task_path=$$(realpath $task_dir)
    docker run --rm --name volta-golden-shards --gpus all \
      --entrypoint bash \
      --volume "$$repo_path:/workspace:ro" \
      --volume "$$task_path:/artifacts" \
      cloudriftai/1cat-vllm-sm70:1.2.2 \
      -lc 'set -euo pipefail
    export PYTHONPATH=/workspace
    cd /workspace
    python -c "from emmy.compiler.pipeline.search.golden import live_recorded_goldens; rows=live_recorded_goldens(); assert rows and len(rows) == 44; print(chr(10).join(sorted(row.name for row in rows)))" > /artifacts/names.txt
    pids=""
    for gpu in $$(seq 0 15); do
      (
        export CUDA_VISIBLE_DEVICES=$$gpu
        export EMMY_CUBIN_CACHE=/artifacts/cubins/gpu-$$gpu
        export EMMY_GPU_LOCK=/artifacts/locks/gpu-$$gpu.lock
        export EMMY_TUNE_DB=/artifacts/shard-$$gpu.db
        export EMMY_ONLINE_FILE=/artifacts/shard-$$gpu-online.json
        rm -rf "$$EMMY_CUBIN_CACHE" "$$EMMY_TUNE_DB" "$$EMMY_ONLINE_FILE"
        start=$$((gpu + 1))
        while IFS= read -r name; do
          echo "[shard $$gpu] tuning $$name"
          python -c "from emmy.emmy import main; main()" tune --golden "$$name" --target sm_70 --patience 50 \
            2>&1 | tee -a /artifacts/shard-$$gpu.log
        done < <(sed -n "$${start}~16p" /artifacts/names.txt)
      ) &
      pids="$$pids $$!"
    done
    status=0
    for pid in $$pids; do
      wait $$pid || status=1
    done
    exit $$status'
  result_files:
    - "*.log"
    - "*.db"
    - "*.json"
    - "names.txt"
  timeout: 21600

matrices:
  deploy.gpu: "NVIDIA Tesla V100 SXM3 32GB"
  deploy.gpu_count: 16
