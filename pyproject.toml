[build-system]
# >=77.0 for the PEP 639 `license` / `license-files` spelling used below.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emmy-ml"
version = "0.3.0"
description = "Deploy and benchmark LLM inference on GPU servers using vLLM"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "CloudRift", email = "support@cloudrift.ai" }]
keywords = ["llm", "inference", "benchmark", "vllm", "sglang", "cuda", "gpu", "compiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
dependencies = [
    # No extras: huggingface_hub 1.x folded the `hf` CLI into the base package and
    # dropped both the `cli` and `hf_transfer` extras, so naming them only produced
    # "does not provide the extra" warnings on every install. hf_transfer is set
    # inside the deploy container's own environment, not from here.
    "huggingface_hub>=1.0",
    "httpx",
    "numpy",
    "pyyaml",
    "catboost",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-xdist", "ruff"]
compile = ["torch", "transformers>=5.10", "cppyy==3.5.0", "safetensors"]
image = ["diffusers>=0.39,<0.40"]
# vLLM out-of-tree embedding plugin (emmy/serving); vllm pins its own torch.
# >=0.23: 0.22.1's FlashInfer dispatch cannot run gemma-4's 512-dim global attention
# (0.23 supports head sizes [64,128,256,512] and has native gemma-4). Our old
# fastapi<0.137 workaround cap is gone: vllm 0.23 pins `fastapi[standard]<0.137`
# upstream, and prometheus-fastapi-instrumentator 8.0.1 fixed the underlying
# `_IncludedRouter` crash anyway.
serving = ["vllm>=0.23,<0.24"]
# lm-eval harness for the output-correctness gate (scripts/run_lmeval_gate.py);
# [api] carries the local-completions client deps (aiohttp, tenacity, tiktoken).
eval = ["lm-eval[api]>=0.4.9"]
visualize = ["playwright>=1.40"]
# flash-attn requires torch at build time, install separately:
#   pip install flash-attn --no-build-isolation
dev = ["pytest", "pytest-asyncio", "pytest-xdist", "ruff", "matplotlib", "graphviz", "torch", "transformers>=5.10", "diffusers>=0.39,<0.40", "cupy-cuda12x; sys_platform == 'linux'", "cppyy==3.5.0", "safetensors", "playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/cloudrift-ai/emmy"
Repository = "https://github.com/cloudrift-ai/emmy"
Issues = "https://github.com/cloudrift-ai/emmy/issues"

[tool.setuptools.packages.find]
include = ["emmy*"]

[tool.setuptools.package-data]
"emmy.compiler.pipeline.search" = ["goldens/*.yaml"]
"emmy.compiler.pipeline.search.prior" = ["*.json"]
# Staged out of the top-level recipes/ by `scripts/prepare_dist.py --recipes`
# (which `make wheel` and the publish workflow both run) — recipes/ sits outside
# the emmy package, so setuptools cannot collect it in place.
"emmy.recipes" = ["*/recipe.yaml"]

[project.scripts]
emmy = "emmy.emmy:main"

[project.entry-points."vllm.general_plugins"]
emmy_serving = "emmy.serving:register"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "perf: GPU performance comparison vs PyTorch (deselected by default; run with `pytest -m perf`)",
]

[tool.ruff]
line-length = 140
target-version = "py312"
# A local serving-A/B venv (`venv-serving`, holding the newer vLLM) doesn't match ruff's default
# venv excludes and would drown `make lint` in third-party findings.
extend-exclude = ["venv-serving"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"emmy/compiler/backend/cuda/generators/tiled.py" = ["E501"]  # Generated CUDA code has long inline PTX strings

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
