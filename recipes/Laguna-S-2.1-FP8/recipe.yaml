# Volta deployment for the exact public FP8 checkpoint on 8x V100 SXM3 32GB.
model:
  huggingface: "poolside/Laguna-S-2.1-FP8"
  revision: 06d71e91db70a11b08ee6a09c3c4818c85a61953
  task: generate

engine:
  llm:
    tensor_parallel_size: 8
    pipeline_parallel_size: 1
    gpu_memory_utilization: 0.90
    context_length: 1048576
    max_concurrent_requests: 1
    vllm:
      image: "emmy-round2-laguna-fp8-sm70:96f26179bf28"
      extra_args: >-
        --dtype half
        --attention-backend FLASH_ATTN_V100
        --max-num-batched-tokens 1024
        --enforce-eager
        --disable-custom-all-reduce
        --enable-auto-tool-choice
        --tool-call-parser poolside_v1
        --reasoning-parser poolside_v1
        --default-chat-template-kwargs '{"enable_thinking": true}'
      extra_env:
        VLLM_SM70_FLASH_ATTN_V100: "1"
        VLLM_SM70_FP8_TURBOMIND: "1"
        VLLM_SM70_FP8_MOE_DEQUANT_FALLBACK: "0"
        VLLM_SM70_FP8_MOE_BATCHED_GEMM: "1"

matrices:
  deploy.gpu: "NVIDIA Tesla V100 SXM3 32GB"
  deploy.gpu_count: 8
