# Qualified on one RTX 5090 with the official 2.01 bpw checkpoint. This standard-math lane uses a width-1 CUDA
# graph for decode and two-token chunked prefill; FAST_MATH changed the exact top-10 oracle without improving
# throughput. The local image is built from this checkout; publication requires separate approval.
model:
  huggingface: "turboderp/Laguna-S-2.1-exl3"
  revision: 348cf8c2cdea2326fde367399c8f0ff6e1dea842
  task: generate

engine:
  llm:
    tensor_parallel_size: 1
    context_length: 16384
    max_concurrent_requests: 1
    gpu_memory_utilization: 0.951
    vllm:
      image: "emmy-laguna-exl3:849cd680"
      extra_args: >-
        --runner generate
        --dtype float16
        --generation-config vllm
        --hf-overrides '{"architectures":["EmmyGenModel"],"quantization_config":null}'
        --max-num-batched-tokens 2
        --no-enable-prefix-caching
        --compilation-config
        '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1],"custom_ops":["+rotary_embedding"]}'
        --enable-auto-tool-choice
        --tool-call-parser poolside_v1
        --reasoning-parser poolside_v1
      extra_env:
        EMMY_GEN_EMBED_HOST: "1"
        EMMY_GEN_DECODE_BUCKET: "2"
        EMMY_GEN_PREFILL_CAPACITY: "2"
        EMMY_GEN_PREFILL_BUCKET: "0"
        EMMY_GEN_M1_TIER: "0"
        EMMY_GEN_ALIAS_ATTN: "0"
        PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
        PYTORCH_ALLOC_CONF: "expandable_segments:True"

matrices:
  deploy.gpu: "NVIDIA GeForce RTX 5090"
  deploy.gpu_count: 1
