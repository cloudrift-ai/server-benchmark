# gemma-4-12B-it benchmark — vLLM + emmy generative plugin, EMMY_FAST_MATH fork
# (FP16, single RTX 5090).
#
# The fast-math arm of the three-recipe A/B set (see gemma-4-12B-it for the stock
# baseline and gemma-4-12B-it-emmy for the standard emmy fork). Identical to the emmy
# recipe except EMMY_FAST_MATH=1, which is a meta gate that offers the precision-trading
# kernel siblings (f16-accumulate mma, __expf) on the consumer-die 5090 — measured on
# the gemma-4-12B goldens as a faster lane at torch-default fp16 numerics.
#
# NOTE: the fast-math fork compiles its OWN kernels, and the prebuilt image's baked cubins
# are the STANDARD fork — so this lane recompiles them on first boot (cubin-cached after
# that). It rides the prebuilt image anyway, because that is the only published emmy image;
# the compile-on-boot base it used to pin was never pushed. Budget a long first boot, and
# see the standard recipe's image comment for the pack-miss hazard across the sweep.
model:
  huggingface: "google/gemma-4-12B-it"

engine:
  llm:
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.97
    vllm:
      image: "cloudriftai/vllm-emmy-gemma-4-12b-it:latest"
      extra_args: "--runner generate --dtype float16 --enforce-eager --hf-overrides '{\"architectures\":[\"EmmyGenModel\"]}' --max-num-batched-tokens 4096 --no-enable-prefix-caching"
      # The only difference from gemma-4-12B-it-emmy: enable the fast-math kernel fork.
      extra_env:
        EMMY_FAST_MATH: "1"

benchmark:
  seed: 0
  temperature: 0
  ignore_eos: true

matrices:
  - deploy.gpu: "NVIDIA GeForce RTX 5090"
    deploy.gpu_count: 1
    benchmark.max_concurrency: 1
    benchmark.num_prompts: 32
    benchmark.random_output_len: 4096
    zip:
      benchmark.random_input_len: [512, 2048, 4096, 8192, 16384, 32768, 65536]
      engine.llm.context_length: [8192, 8192, 8192, 16384, 24576, 40960, 73728]

  - deploy.gpu: "NVIDIA GeForce RTX 5090"
    deploy.gpu_count: 1
    benchmark.random_input_len: 2048
    benchmark.random_output_len: 128
    engine.llm.context_length: 8192
    zip:
      benchmark.max_concurrency: [4, 8]
      benchmark.num_prompts: [32, 64]
