# gemma-4-12B-it benchmark — vLLM + emmy generative plugin (FP16, single RTX 5090).
#
# The emmy arm of the three-recipe A/B set (see gemma-4-12B-it for the stock baseline
# and gemma-4-12B-it-emmy-fastmath for the fast-math fork). Serving the emmy compiler
# plugin instead of stock vLLM kernels is "just a different image + extra_args pair":
# vLLM owns the serving shell, tokenizer, scheduler, RoPE and paged KV cache, while the
# transformer trunk (embed + per-layer pre/post + final norm) runs on emmy-compiled
# CUDA kernels via EmmyGenModel.
model:
  huggingface: "google/gemma-4-12B-it"

engine:
  llm:
    tensor_parallel_size: 1
    # 0.97 (not stock's 0.9): the emmy generative arm's embed table + norm residents
    # live in cupy, claimed BEFORE vLLM's torch-only memory profiler runs, so they must
    # sit INSIDE the utilization budget or the KV-cache min-fit check fails at boot
    # (serve.py _GENERATE_GPU_MEMORY_UTILIZATION).
    gpu_memory_utilization: 0.97
    vllm:
      # The published prebuilt image (docker/vllm-emmy-serve/). It bakes the gemma-4-12B
      # snapshot + warmed sm_120 cubins + the execution-plan pack, so a boot at the SHAPE IT
      # WAS WARMED AT is tokenless and compile-free. It is also the only published emmy
      # image — the general compile-on-boot cloudriftai/vllm-emmy base this recipe used to
      # pin was never pushed to Docker Hub.
      #
      # READ THIS BEFORE RUNNING THE SWEEP. The pack is keyed on the serving shape, and this
      # image was warmed at --max-model-len 8448 / --max-num-batched-tokens 4128. Every
      # variant below runs a DIFFERENT context_length (8192 ... 73728) and mnbt 4096, so
      # every one of them misses the pack and re-runs the whole compiler frontend on boot
      # (~50 min of host CPU measured at an uncovered width). That can exceed the compose
      # healthcheck window (start_period 1200s + 180x10s = 3000s), in which case the deploy
      # is killed as unhealthy rather than producing a number. The cubins still hit, so this
      # is boot cost and not a numerics change — but on a slow host the sweep may simply not
      # complete. Re-warm the image at the width you need, or expect long boots.
      image: "cloudriftai/vllm-emmy-gemma-4-12b-it:latest"
      # --runner generate + the EmmyGenModel override + fp16 across the emmy↔vLLM seam;
      # --enforce-eager keeps vLLM from capturing around the runner's own kernel
      # launches; --max-num-batched-tokens 4096 is the per-step prefill-chunk cap (the
      # one hard emmy limit — long inputs stream through chunked prefill under it, and
      # context length is unbounded because RoPE + paged KV are vLLM-owned on this path).
      # --no-enable-prefix-caching matches stock so every request does full work.
      extra_args: "--runner generate --dtype float16 --enforce-eager --hf-overrides '{\"architectures\":[\"EmmyGenModel\"]}' --max-num-batched-tokens 4096 --no-enable-prefix-caching"

benchmark:
  # Identical controlled workload to the stock recipe (see gemma-4-12B-it).
  seed: 0
  temperature: 0
  ignore_eos: true

matrices:
  # Same grid as the stock recipe — the emmy generative path has no context ceiling
  # (RoPE + paged KV are vLLM-owned), so it runs the full input-size sweep too.
  - deploy.gpu: "NVIDIA GeForce RTX 5090"
    deploy.gpu_count: 1
    benchmark.max_concurrency: 1
    benchmark.num_prompts: 32
    benchmark.random_output_len: 4096
    zip:
      benchmark.random_input_len: [512, 2048, 4096, 8192, 16384, 32768, 65536]
      engine.llm.context_length: [8192, 8192, 8192, 16384, 24576, 40960, 73728]

  - deploy.gpu: "NVIDIA GeForce RTX 5090"
    deploy.gpu_count: 1
    benchmark.random_input_len: 2048
    benchmark.random_output_len: 128
    engine.llm.context_length: 8192
    zip:
      benchmark.max_concurrency: [4, 8]
      benchmark.num_prompts: [32, 64]
