# gemma-4-12B-it benchmark — stock vLLM baseline (FP16, single RTX 5090).
#
# One of a three-recipe A/B set that backs the blog article:
#   gemma-4-12B-it               — stock vLLM (this file)
#   gemma-4-12B-it-emmy          — vLLM + emmy generative plugin (EmmyGenModel)
#   gemma-4-12B-it-emmy-fastmath — same plugin, EMMY_FAST_MATH fork
# All three share the identical workload grid below, so the three engines are compared
# point-for-point on the same prompt set.
model:
  huggingface: "google/gemma-4-12B-it"

engine:
  llm:
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.9
    vllm:
      # gemma-4-capable stock image (same tag the gemma-4-31B-it recipe uses).
      image: "vllm/vllm-openai:gemma4-0505-cu129"
      # --dtype float16 pins FP16 across all three engines (the checkpoint is bf16 by
      # default, and the emmy trunk emits fp16 — matching it keeps the A/B honest).
      # --no-enable-prefix-caching makes every request do full prefill work.
      extra_args: "--dtype float16 --no-enable-prefix-caching"

benchmark:
  # Controlled workload, identical across engines: a fixed random prompt set (seed 0),
  # greedy decoding (temperature 0), and every request emits exactly random_output_len
  # tokens (ignore_eos) so all engines do the same amount of work. The per-point
  # concurrency / prompt count / input+output lengths come from the matrix.
  seed: 0
  temperature: 0
  ignore_eos: true

matrices:
  # Headline + input-size sweep: concurrency 1, output 4096, input swept with the
  # context length zipped alongside it (context ≥ input + output). The headline point
  # is random_input_len 4096 @ context 8192; the rest widen the prefill.
  - deploy.gpu: "NVIDIA GeForce RTX 5090"
    deploy.gpu_count: 1
    benchmark.max_concurrency: 1
    benchmark.num_prompts: 32
    benchmark.random_output_len: 4096
    zip:
      benchmark.random_input_len: [512, 2048, 4096, 8192, 16384, 32768, 65536]
      engine.llm.context_length: [8192, 8192, 8192, 16384, 24576, 40960, 73728]

  # Batching sweep: input 2048 / output 128 / context 8192 at concurrency 4 and 8.
  # num_prompts ≥ max(32, 8 × concurrency).
  - deploy.gpu: "NVIDIA GeForce RTX 5090"
    deploy.gpu_count: 1
    benchmark.random_input_len: 2048
    benchmark.random_output_len: 128
    engine.llm.context_length: 8192
    zip:
      benchmark.max_concurrency: [4, 8]
      benchmark.num_prompts: [32, 64]
