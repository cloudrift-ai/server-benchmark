# google/gemma-4-12B base-checkpoint text generation through the Emmy generative plugin on
# one RTX 5090. Base checkpoints serve continuations through /v1/completions; this recipe
# does not claim the instruction-tuned checkpoint's chat or multimodal contract.
model:
  huggingface: "google/gemma-4-12B"
  revision: 023679ed352de9bb66cc873c9009ce3482585c08
  smoke_test: completion

engine:
  llm:
    tensor_parallel_size: 1
    context_length: 131072
    max_concurrent_requests: 64
    gpu_memory_utilization: 0.96
    vllm:
      # Local, release-qualified image retained on kenshin. Publication was intentionally
      # omitted; rebuild it from docker/vllm-emmy-serve/models/gemma-4-12b.env when absent.
      image: "cloudriftai/vllm-emmy-gemma-4-12b:0.23.0-5208dcf6"
      extra_args: >-
        --runner generate
        --dtype float16
        --hf-overrides '{"architectures":["EmmyGenModel"]}'
        --max-num-batched-tokens 4128
        --no-enable-prefix-caching
      extra_env:
        # The exact standard-vs-FAST_MATH completion gate is recorded in RESULTS.md.
        EMMY_FAST_MATH: "1"
        EMMY_GEN_DECODE_BUCKET: "32"
        VLLM_USE_V2_MODEL_RUNNER: "1"

matrices:
  deploy.gpu: "NVIDIA GeForce RTX 5090"
  deploy.gpu_count: 1
