# google/gemma-4-12B base-checkpoint text generation on one RTX 5090. This is
# deliberately distinct from the instruction-tuned checkpoint used by the Gemma 4
# performance article: base checkpoints serve continuations through /v1/completions.
model:
  huggingface: "google/gemma-4-12B"
  revision: 023679ed352de9bb66cc873c9009ce3482585c08
  smoke_test: completion

engine:
  llm:
    tensor_parallel_size: 1
    context_length: 16384
    max_concurrent_requests: 1
    # The supplied workstation retains about 941 MiB for its graphical session. vLLM
    # sees 29.91 GiB after imports, below the 30.07 GiB requested at 0.96.
    gpu_memory_utilization: 0.95
    vllm:
      image: "vllm/vllm-openai@sha256:6d8429e38e3747723ca07ee1b17972e09bb9c51c4032b266f24fb1cc3b22ed8f"
      extra_args: >-
        --dtype float16
        --generation-config vllm

matrices:
  deploy.gpu: "NVIDIA GeForce RTX 5090"
  deploy.gpu_count: 1
