# The six-cut statistics route of the sibling rmsnorm-qk-sdpa-stat-route case, plus a cooperative
# reduce row. One of the statistics producer pieces is chain-form — a zero-axis projection root
# with no operand edges, carrying its captured providers ahead of the row reduce — and its DIRECT
# body member is the fold this row partitions. That member offered only the serial fold until the
# reduce tier learned the chain arm, so a partition-naming REDUCE pin was a recorded refusal here;
# the piece's boundary store is a plain workspace write (no output sweep, no streamed result), so
# nothing keeps it serial now. Neither cut alone reaches this shape: the three-cut route mints no
# chain-form piece at all, and the six-cut route without the row leaves the partition to greedy.
#
# The member's own canonical key is the BARE REDUCE — it is the root-most reduce site of its piece
# — so the row cannot address it by site, and a bare pin fans out over every kernel in the graph.
# `REDUCE@a4: ''` is what makes the row discriminate anyway: the chain piece is the only kernel
# carrying a nested contraction, so its row is the only one the pin set can satisfy, and a silent
# revert of the member to the serial fold fails the offered oracle instead of borrowing a sibling
# kernel's cooperative row. The scoped OFF is also the honest decision for that contraction, which
# emits its a4 loop serially whatever the bare pin fans onto it.
