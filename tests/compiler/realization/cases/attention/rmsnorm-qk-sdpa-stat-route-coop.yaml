# The six-cut statistics route of the sibling rmsnorm-qk-sdpa-stat-route case, plus a cooperative
# reduce row. One of the statistics producer pieces is chain-form — a zero-axis projection root
# with no operand edges, carrying its captured providers ahead of the row reduce — and its DIRECT
# body member is the fold this row partitions. That member offered only the serial fold until the
# reduce tier learned the chain arm, so a partition-naming REDUCE pin reached no offered row here;
# the piece's boundary store is a plain workspace write (no output sweep, no streamed result), so
# nothing keeps it serial now. Neither cut alone reaches this shape: the three-cut route mints no
# chain-form piece at all, and the six-cut route without the row leaves the partition to greedy.
#
# The piece carries TWO reduce sites — the partitioned member and the contraction nested under it —
# so the classic codec spells both by node id and the row addresses them exactly. `REDUCE@n1: coop`
# is the member's partition and `REDUCE@n2: ''` its nested contraction's honest serial decision;
# no other kernel in this graph carries either key, which is what makes the row discriminate. A
# silent revert of the member to the serial fold fails the offered oracle here instead of borrowing
# a sibling kernel's cooperative row. Node ids are problem-local, so the pair is re-derived whenever
# the piece's site numbering moves.
