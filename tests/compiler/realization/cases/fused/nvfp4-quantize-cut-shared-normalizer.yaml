# Cutting a shared value out of the NVFP4 activation quantize. The kernel RMS-normalizes its input
# and encodes the result, so the normalizer feeds the encode's every branch, and the cut materializes
# it into a workspace the rest of the kernel reads back.
#
# The read is the point. A lowered body reads producer names throughout, so an edge's result name is
# what the emitted kernel declares -- and the cut replaces the occurrences of ONE cone object, while
# a structurally equal cone elsewhere in the same kernel keeps computing that value in place under
# the same name. Naming the workspace read after the cone rather than after the workspace therefore
# declares one name twice in one scope, from two different sources, which nvcc rejects. So this case
# earns its keep at `built`: the schedule realizes either way, and only the compiler accepts or
# refuses the source.
#
# evidence: the same route is what `tune` proposes on the Qwen3-8B-NVFP4 decode trunk, where it
# reached nvcc as `"v23" has already been declared in the current scope` and cost the candidate its
# measurement.
