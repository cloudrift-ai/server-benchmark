# One half of the contraction reuse the warp-flash materializer rides: a bilinear fold placed
# under LEADING batch grid axes, tiled onto mma.sync by the shared contraction codegen rather
# than by anything attention-specific.
#
# The score contraction: the reduced axis is last in BOTH operands, so B is transposed. The
# source test spells that by hand in a LoopOp; the wire has no LoopOp, so the transpose is
# spelled as a frontend op on K and absorbed into the operand's index map, which lands on
# the same transposing gmem fragment helper.
#
# One batch, four heads, head dim 64.
compute_cap:
- 12
- 0
programs:
- inputs: [q, k]
  outputs: [c]
  nodes:
  - id: k
    op: input
    outputs: [[k, f16, [1, 4, 128, 64]]]
  - id: kt
    op: torch.transpose
    attrs: {axes: {__tuple__: [0, 1, 3, 2]}}
    inputs: [k]
    outputs: [[kt, f16, [1, 4, 64, 128]]]
  - id: q
    op: input
    outputs: [[q, f16, [1, 4, 128, 64]]]
  - id: c
    op: torch.matmul
    attrs: {has_bias: false}
    inputs: [q, kt]
    outputs: [[c, f32, [1, 4, 128, 128]]]
configs:
- program: 0
  target:
    origins:
    - c
    - kt
  realizations:
  - name: k_matmul_ff2a82.91cf7c5fde59
    bindings: {}
    pins:
      FAST_MATH: false
    knobs:
      TILE: mma_m16n8k16_f16_f32/f4x8/k2
      WORK: w2x2
