# The f16-accumulate atom: the mma chain accumulates into PACKED f16 fragments at the full
# HMMA rate and a periodic promote folds them into the f32 shadows the store reads. The
# precision policy gates the fork, so FAST_MATH rides the input pins as the umbrella that
# offers it — without it the atom is enumerated nowhere and the pin names no row.
#
# REDUCE is deliberately ABSENT, as in the source test: the subject is the accumulator and
# its promote cadence, and the reduce partition stays the schedule's own decision.
#
# A SYMBOLIC contraction extent on the smallest one-warp-one-atom tile: the masked-K tail
# zero-fills the operand fragments and the unconditional final promote folds the partial
# last chunk. STAGE is absent (the source test unsets it) — a byte-copied operand stages K
# as its contiguous inner dim, so a symbolic K has no staged transport to ask for.
#
# The case runs at the symbol's 512 hint. A case file cannot say 'compile at the hint, run
# at 70' — binding a symbol here SPECIALIZES the program instead of sizing a run of it — so
# what is asserted is the symbolic kernel, not the off-hint extents the source test swept.
compute_cap:
- 12
- 0
programs:
- inputs: [a, b]
  outputs: [o]
  nodes:
  - id: a
    op: input
    outputs: [[a, f16, [128, {sym: seq_len, hint: 512}]]]
  - id: b
    op: input
    outputs: [[b, f16, [{sym: seq_len, hint: 512}, 128]]]
  - id: o
    op: torch.matmul
    attrs: {has_bias: false}
    inputs: [a, b]
    outputs: [[o, f16, [128, 128]]]
configs:
- program: 0
  target:
    origins:
    - o
  realizations:
  - name: k_matmul_fb199e.4e9bbee39015
    bindings: {}
    pins:
      FAST_MATH: true
    knobs:
      TILE: mma_m16n8k16_f16_f16/f1x1
      WORK: w1x1
    identity: bbcf3df8f0353cf70962bd6be6e0d8ed14dad4fdb1ce1eccc721dda90896354f
