# The CTA launch-order codec: consecutive CTAs are remapped into grouped stripes so they
# share the streamed operand in L2 instead of re-streaming it from DRAM once per output row.
# The claim under test is exactly-once coverage — every output tile produced by one CTA and
# no other under the remapped order, which a wrong sub-id decode breaks silently.
#
# The transpose: N block-tiles fastest, in groups of 4, and the N extent divides the group
# so the decode takes the clamp-free form.
