# A transposed-B (serving F.linear layout) warp matmul that STAGES its B operand, keeping
# the operand's own N-major orientation so K stays stride-1 in gmem and smem alike and the
# fill's chunks stay contiguous. The slab drains through the plain ldmatrix, not the
# transposing one. This is the transport the gmem-direct-only enumeration used to leave
# behind on every serving .lin fork.
#
# The ring here is cp.async.
#
# Frontend linear stands in for the source test's hand-built LoopOp; see the mma coverage
# cases for why the wire cannot hold one.
compute_cap:
- 12
- 0
programs:
- inputs: [a, b]
  outputs: [o]
  nodes:
  - id: a
    op: input
    outputs: [[a, f16, [128, 128]]]
  - id: b
    op: input
    outputs: [[b, f16, [128, 128]]]
  - id: o
    op: torch.linear
    attrs: {has_bias: false}
    inputs: [a, b]
    outputs: [[o, f16, [128, 128]]]
configs:
- program: 0
  target:
    origins:
    - o
  realizations:
  - name: k_linear_087a34.71192fedaab6
    bindings: {}
    pins:
      FAST_MATH: false
