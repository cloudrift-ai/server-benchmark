# A symbolic axis reaches the warp tier as a MASKED tile: the planner ceil-divs the grid,
# hoists the K pipeline above a boundary condition, stamps per-element row/column guards onto
# the register store, and zero-fills the partial final slab past a symbolic reduce extent.
# One cached kernel serves every runtime size.
#
# The source test sweeps deliberately off-hint sizes (1, 31, 130, 700). A case file has no
# spelling for that: a symbolic case runs at the symbol's own hint, and binding the symbol
# here would SPECIALIZE the program rather than size a run of it. What is stored is therefore
# the schedule claim — that this masked row is still offered, realized, built and correct —
# with the off-hint extents left to the sweep that owns them.
#
# The REDUCE axis symbolic (the attention P@V shape after the demoted-matmul split): the
# partial final K slab is what zero-fills. Gmem-direct for the same reason the symbolic-N case
# gives — a symbolic K has no staged transport.
compute_cap:
- 12
- 0
programs:
- inputs: [a, b]
  outputs: [o]
  nodes:
  - id: a
    op: input
    outputs: [[a, f16, [64, {sym: seq_len, hint: 512}]]]
  - id: b
    op: input
    outputs: [[b, f16, [{sym: seq_len, hint: 512}, 128]]]
  - id: o
    op: torch.matmul
    attrs: {has_bias: false}
    inputs: [a, b]
    outputs: [[o, f16, [64, 128]]]
configs:
- program: 0
  target:
    origins:
    - o
  realizations:
  - name: k_matmul_347edd.ed31cfd1c17d
    bindings: {}
    pins:
      FAST_MATH: false
    knobs:
      TILE: mma_m16n8k16_f16_f32/f2x2/k2
      WORK: w2x2
      STAGE: ''
      REDUCE: ''
    identity: 125fc4acbf271a9dbdf058bf11cff56c6eac69d8a985eca97c86732794a6ac28
