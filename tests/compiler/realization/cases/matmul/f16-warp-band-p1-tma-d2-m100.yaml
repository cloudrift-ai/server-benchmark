# A warp-SPECIALIZED staged matmul: the +p<n> producer band rides the WORK inventory (never a
# row key of its own), the launch widens past the compute band's threads, the grid decode
# wraps the aux warps onto the CTA's cells, the TMA fill moves to the producer's elected
# thread, and the compute band drains through the data / empty mbarrier handshake. Bit
# identity with the uniform pipeline is NOT expected — the split changes scheduling, not the
# mma math — so accuracy against numpy is the whole claim.
#
# A masked M: the producer's box zero-fills past the last row and the store guards it.
compute_cap:
- 12
- 0
programs:
- inputs: [a, b]
  outputs: [o]
  nodes:
  - id: a
    op: input
    outputs: [[a, f16, [100, 256]]]
  - id: b
    op: input
    outputs: [[b, f16, [256, 128]]]
  - id: o
    op: torch.matmul
    attrs: {has_bias: false}
    inputs: [a, b]
    outputs: [[o, f16, [100, 128]]]
configs:
- program: 0
  target:
    origins:
    - o
  realizations:
