# An asymmetric-enough shape that the schedule takes an outer K split, putting a serial
# K_o tile between the atom tile and the stage bundle. The bundle's source origin
# references the K_o coordinate, so a lowering that hoists the bundle above K_o emits a
# kernel referencing an out-of-scope coordinate and nvcc rejects it.
compute_cap:
- 12
- 0
programs:
- inputs: [a, b]
  outputs: [c]
  nodes:
  - id: a
    op: input
    outputs: [[a, f16, [2048, 2048]]]
  - id: b
    op: input
    outputs: [[b, f16, [2048, 2048]]]
  - id: c
    op: torch.matmul
    attrs: {has_bias: false}
    inputs: [a, b]
    outputs: [[c, f16, [2048, 2048]]]
configs:
- program: 0
  target:
    origins:
    - c
  realizations:
  - name: k_matmul_bcd63b.60bebf480b67
    bindings: {}
    pins:
      FAST_MATH: false
