# A projection Map over the contraction (project after contract): the pointwise tail folds
# into the contraction kernel and is replicated per register cell. PLACE=fuse rides the
# input pins rather than the schedule row — the golden loader refuses a realization that
# mixes routing knobs with schedule knobs, and PLACE is consumed by a splice rather than
# stamped on a kernel either way.
#
# A pure activation — no second operand, so the tail loads nothing.
compute_cap:
- 12
- 0
programs:
- inputs: [a, b]
  outputs: [o]
  nodes:
  - id: a
    op: input
    outputs: [[a, f32, [1, 64, 64]]]
  - id: b
    op: input
    outputs: [[b, f32, [64, 64]]]
  - id: ab
    op: torch.matmul
    attrs: {has_bias: false}
    inputs: [a, b]
    outputs: [[ab, f32, [1, 64, 64]]]
  - id: o
    op: tensor.elementwise
    attrs: {op: {__elementwise__: relu}}
    inputs: [ab]
    outputs: [[o, f32, [1, 64, 64]]]
configs:
- program: 0
  target:
    origins:
    - ab
    - o
  realizations:
  - name: k_matmul_6ad993.a9e77993e8e7
