- 12
- 0
programs:
- inputs: [a, b, s]
  outputs: [o]
  nodes:
  - id: a
    op: input
    outputs: [[a, f32, [1, 64, 64]]]
  - id: b
    op: input
    outputs: [[b, f32, [64, 64]]]
  - id: ab
    op: torch.matmul
    attrs: {has_bias: false}
    inputs: [a, b]
    outputs: [[ab, f32, [1, 64, 64]]]
  - id: s
    op: input
    outputs: [[s, f32, [1]]]
  - id: o
    op: tensor.elementwise
    attrs: {op: {__elementwise__: multiply}}
    inputs: [ab, s]
    outputs: [[o, f32, [1, 64, 64]]]
