# A projection Map over the contraction (project after contract): the pointwise tail folds
# into the contraction kernel and is replicated per register cell. PLACE=fuse rides the
# input pins rather than the schedule row — the golden loader refuses a realization that
# mixes routing knobs with schedule knobs, and PLACE is consumed by a splice rather than
# stamped on a kernel either way.
#
# A broadcast scalar multiply — one value shared by every cell of the tile.
