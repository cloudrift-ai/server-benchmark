# The contraction's reduce-axis partition (the REDUCE codec) on a per-cell output. A
# contraction is a monoid with a multiply lift, so its K axis folds through the same
# materializer a plain reduce does; a non-cross-CTA REDUCE pin was silently ignored here
# before. TILE is deliberately ABSENT rather than pinned off — the source test unsets it, so
# the output tier stays the schedule's own decision and only the partition is claimed.
#
# Four threads fold K cooperatively, combining through the warp-shuffle butterfly.
