  - id: b
    op: input
    outputs: [[b, f32, [64, 64]]]
  - id: c
    op: torch.matmul
    attrs: {has_bias: false}
    inputs: [a, b]
    outputs: [[c, f32, [1, 64, 64]]]
configs:
- program: 0
  target:
    origins:
