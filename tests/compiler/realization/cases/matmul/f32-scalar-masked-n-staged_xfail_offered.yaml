  - id: a
    op: input
    outputs: [[a, f32, [64, 64]]]
  - id: b
    op: input
    outputs: [[b, f32, [64, 47]]]
  - id: c
    op: torch.matmul
    attrs: {has_bias: false}
    inputs: [a, b]
    outputs: [[c, f32, [64, 47]]]
