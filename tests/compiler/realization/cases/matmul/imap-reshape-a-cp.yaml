# A layout op between an activation and its matmul is absorbed into the operand's load index,
# so the operand is no longer a plain window of its buffer — but every tiled loader reads one
# anyway. Taking the operand's DECLARED trailing extent as the row stride was the miscompile:
# a reshape that re-strides the rows reads a rectangle of the wrong buffer, silently, on plain
# f16 with no quantization in sight. The contract now is that the row stride is DERIVED from
# the index, the columns must be gmem-contiguous, and a form no loader can read falls back.
#
# The re-strided A under a cp.async fill, which copies a multi-element chunk per row. This is
# the one transport that reads the derived row stride correctly on this operand — its two
# siblings do not, which is what makes it worth pinning down rather than assuming.
compute_cap:
- 12
- 0
programs:
- inputs: [x, w]
  outputs: [o]
  nodes:
  - id: w
    op: input
    outputs: [[w, f16, [128, 64]]]
  - id: x
    op: input
    outputs: [[x, f16, [128, 256]]]
  - id: xr
    op: torch.reshape
    attrs: {shape: {__tuple__: [256, 128]}}
    inputs: [x]
    outputs: [[xr, f16, [256, 128]]]
  - id: o
    op: torch.matmul
    attrs: {has_bias: false}
    inputs: [xr, w]
    outputs: [[o, f16, [256, 64]]]
configs:
- program: 0
  target:
    origins:
    - o
    - xr
  realizations:
  - name: k_matmul_fd43f7.d8cc89489c4e
    bindings: {}
    pins:
      FAST_MATH: false
    knobs:
      STAGE: d2/smem-async
    identity: 09ca8ac30e5a4f056ce71f077b8e83e309bd1b25db4828f0b5ee5f3030099777
