# A layout op between an activation and its matmul is absorbed into the operand's load index,
# so the operand is no longer a plain window of its buffer — but every tiled loader reads one
# anyway. Taking the operand's DECLARED trailing extent as the row stride was the miscompile:
# a reshape that re-strides the rows reads a rectangle of the wrong buffer, silently, on plain
# f16 with no quantization in sight. The contract now is that the row stride is DERIVED from
# the index, the columns must be gmem-contiguous, and a form no loader can read falls back.
#
# The re-strided A under a TMA box, which deposits a dense rectangle in the DESCRIPTOR's own
# coordinates. 83% of the output is wrong: the descriptor is built from the declared shape.
#
# evidence: imap-reshape-a-cp.yaml is the same program on the sibling staged transport and is
# correct; imap-slice-a-tma.yaml is this transport on a canonical index and is correct. The
# source test additionally asserted this row should DECLINE the box and fall back — that
# assertion has its own standing xfail ('nvcc rejects the fallback kernel'), so the pin
# reaching a TMA box at all is part of the same gap. This row does not fault: it launches
# cleanly and returns a wrong answer, which the source test's fault-worded marker never said.
compute_cap:
- 12
- 0
programs:
- inputs: [x, w]
  outputs: [o]
  nodes:
  - id: w
    op: input
    outputs: [[w, f16, [128, 64]]]
  - id: x
    op: input
    outputs: [[x, f16, [128, 256]]]
  - id: xr
    op: torch.reshape
    attrs: {shape: {__tuple__: [256, 128]}}
    inputs: [x]
    outputs: [[xr, f16, [256, 128]]]
  - id: o
    op: torch.matmul
    attrs: {has_bias: false}
    inputs: [xr, w]
    outputs: [[o, f16, [256, 64]]]
configs:
- program: 0
  target:
    origins:
    - o
    - xr
  realizations:
  - name: k_matmul_917caa.4fa8a20990ba
    bindings: {}
    pins:
      FAST_MATH: false
    knobs:
      WORK: w1x1
      TILE: mma_m16n8k16_f16_f32/f4x2/k4
      REDUCE: ''
      STAGE: d2/smem-tma
      RASTER: ''
    identity: 58744ef097aea160ce90e000a403f2dd11f5a4f5cc037de48a4db510c3f1462b
