# A layout op between an activation and its matmul is absorbed into the operand's load index,
# so the operand is no longer a plain window of its buffer — but every tiled loader reads one
# anyway. Taking the operand's DECLARED trailing extent as the row stride was the miscompile:
# a reshape that re-strides the rows reads a rectangle of the wrong buffer, silently, on plain
# f16 with no quantization in sight. The contract now is that the row stride is DERIVED from
# the index, the columns must be gmem-contiguous, and a form no loader can read falls back.
#
# The B-side twin of the re-strided A, read gmem-direct. 87% of the output is wrong.
#
# evidence: imap-reshape-a-cp.yaml proves a re-strided operand's derived row stride IS
# recoverable on this compiler, and imap-slice-a-gmem.yaml proves this transport is correct on a
# canonical index at these shapes. This row launches cleanly and returns a wrong answer rather
# than faulting, so the source test's 'faults (misaligned address)' marker does not describe it.
# The B side has no correct transport at all: the one row that DOES fault is its cp.async
# sibling, which is held out of the corpus for that reason (see imap-reshape-b-tma).
compute_cap:
- 12
- 0
programs:
- inputs: [x, w]
  outputs: [o]
  nodes:
  - id: w
    op: input
    outputs: [[w, f16, [256, 64]]]
  - id: wr
    op: torch.reshape
    attrs: {shape: {__tuple__: [128, 128]}}
    inputs: [w]
    outputs: [[wr, f16, [128, 128]]]
  - id: x
    op: input
    outputs: [[x, f16, [64, 128]]]
  - id: o
    op: torch.matmul
    attrs: {has_bias: false}
    inputs: [x, wr]
    outputs: [[o, f16, [64, 128]]]
configs:
- program: 0
  target:
    origins:
    - o
    - wr
  realizations:
  - name: k_matmul_d92284.13b5934e39c9
    bindings: {}
    pins:
      FAST_MATH: false
    knobs:
      STAGE: ''
    identity: b5d2469fc598d4117b398f0704f7bd49257085ddb5f038bf1d0214f82be8add4
