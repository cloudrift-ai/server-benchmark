# A layout op between an activation and its matmul is absorbed into the operand's load index,
# so the operand is no longer a plain window of its buffer — but every tiled loader reads one
# anyway. Taking the operand's DECLARED trailing extent as the row stride was the miscompile:
# a reshape that re-strides the rows reads a rectangle of the wrong buffer, silently, on plain
# f16 with no quantization in sight. The contract now is that the row stride is DERIVED from
# the index, the columns must be gmem-contiguous, and a form no loader can read falls back.
#
# A trailing slice from zero — the one layout op that leaves the operand index CANONICAL, so
# nothing has to be derived. Gmem-direct. The control the reshape and transpose rows are read
# against: it was always right, and it must stay right.
compute_cap:
- 12
- 0
programs:
- inputs: [x, w]
  outputs: [o]
  nodes:
  - id: w
    op: input
    outputs: [[w, f16, [128, 64]]]
  - id: x
    op: input
    outputs: [[x, f16, [128, 256]]]
  - id: xr
    op: torch.slice
    attrs: {shape: {__tuple__: [128, 128]}, dim: -1, start: 0}
    inputs: [x]
    outputs: [[xr, f16, [128, 128]]]
  - id: o
    op: torch.matmul
    attrs: {has_bias: false}
    inputs: [xr, w]
    outputs: [[o, f16, [128, 64]]]
configs:
- program: 0
  target:
    origins:
    - o
    - xr
  realizations:
  - name: k_matmul_349297.6e077ac50f40
    bindings: {}
    pins:
      FAST_MATH: false
    knobs:
      STAGE: ''
    identity: e828e5662f2a76263aff614697d61a37a5c860678edf611f11bb8408581dc116
