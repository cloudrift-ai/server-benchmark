# The W4A4 linear as `--ir cuda` renders it: a packed-pair (NVFP4) weight and activation staged as
# raw byte slabs, drained by the block-scaled tensor-core cell, with the per-fragment statement runs
# re-rolled into `#pragma unroll` loops (`LOOPIFY`, the readability policy `emmy compile` turns on).
# Re-rolling arrays a fragment family under one declaration, so the drains address their members
# subscripted (`_b[_r0]`) instead of by the family member's own name. The dtype of a fragment hangs
# off the family, and every reader of it falls back silently when the reference misses, so this is
# the one schedule where a packed byte slab can be read as an fp8 one -- one stored byte standing
# for one K value instead of two.
#
# `LOOPIFY` rides in `pins` because it is an input regime rather than a schedule row: it re-spells
# the emitted source and leaves the SASS alone, so no `TILE` / `WORK` / `STAGE` value can express it.
