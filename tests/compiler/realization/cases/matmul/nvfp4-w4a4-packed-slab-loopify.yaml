# The W4A4 linear as `--ir cuda` renders it: a packed-pair (NVFP4) weight and activation staged as
# raw byte slabs, drained by the block-scaled tensor-core cell, with the per-fragment statement runs
# re-rolled into `#pragma unroll` loops (`LOOPIFY`, the readability policy `emmy compile` turns on).
# Re-rolling arrays a fragment family under one declaration, so its members are addressed
# subscripted (`_b[_r0]`) rather than by a name of their own. Two things then hang off the family
# instead of the reference: the fragment's dtype, whose readers all fall back silently, and the
# declared shape, which a family of scalar registers (the block scales) has to keep. This is the
# only schedule where either can be lost, and both cost the packed slab its meaning -- one stored
# byte read as one K value where it holds two.
#
# `LOOPIFY` rides in `pins` because it is an input regime rather than a schedule row: it re-spells
# the emitted source and leaves the SASS alone, so no `TILE` / `WORK` / `STAGE` value can express
# it. The target is the exact Loop program rather than the frontend one, because the checkpoint's
# e2m1 value table reaches the graph as a constant with no inline value, which the numpy twin
# cannot supply -- the same reason the fused NVFP4 case takes a Loop target.
