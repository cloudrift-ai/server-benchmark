# The same combine cell over a SYMBOLIC reduce axis: a degenerate Accum carrier over the maximum monoid,
# partitioned as one thread per cell — no cross-thread or register fold at all.
#
# The kernel carries the runtime extent as an argument and each lane strides to it, so
# the strided bound IS the masked tail — a lane starting past the extent folds the
# carrier identity. mean's divisor is the runtime extent too, resolved at launch.
#
# The case runs at the axis hint, 512. The test this replaces also ran the same kernel
# at 700 to straddle the tile; a case file cannot spell 'compile symbolic, run at some
# other size', so the off-hint sweep stays in Python.
compute_cap:
- 12
- 0
programs:
- inputs: [x]
  outputs: [amax]
  nodes:
  - id: x
    op: input
    outputs: [[x, f32, [4, {sym: seq_len, hint: 512}]]]
  - id: amax
    op: tensor.reduce
    attrs: {op: {__elementwise__: amax}, axis: 1}
    inputs: [x]
    outputs: [[amax, f32, [4, 1]]]
configs:
- program: 0
  target:
    origins:
    - amax
  realizations:
  - name: k_amax_reduce.779a740ddf03
    bindings: {}
    pins:
      FAST_MATH: false
    knobs:
      REDUCE: ''
