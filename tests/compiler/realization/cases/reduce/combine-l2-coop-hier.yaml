# The carrier-generic cooperative combine at one cell of its matrix: an Accum carrier under both a pre-map (square) and a projection epilogue (sqrt),
# partitioned as the 4-warp hierarchical shuffle-then-smem-tree (coop at a 128-thread block).
#
# Every carrier folds through the SAME combine and differs only in its state, so one
# partition kind breaking on a carrier it was not tuned on is exactly what the matrix
# catches. The reduce axis is 1024 so the 128-thread row reaches the cross-warp tree.
compute_cap:
- 12
- 0
programs:
- inputs: [x]
  outputs: [sqrt]
  nodes:
  - id: x
    op: input
    outputs: [[x, f32, [4, 1024]]]
  - id: mul
    op: tensor.elementwise
    attrs: {op: {__elementwise__: multiply}}
    inputs: [x, x]
    outputs: [[mul, f32, [4, 1024]]]
  - id: sum_1
    op: tensor.reduce
    attrs: {op: {__elementwise__: sum}, axis: 1}
    inputs: [mul]
    outputs: [[sum_1, f32, [4, 1]]]
  - id: sqrt
    op: tensor.elementwise
    attrs: {op: {__elementwise__: sqrt}}
    inputs: [sum_1]
    outputs: [[sqrt, f32, [4, 1]]]
configs:
- program: 0
  target:
    origins:
    - mul
    - sqrt
    - sum_1
  realizations:
  - name: k_sqrt_reduce.5fb4f2c2eb26
    bindings: {}
    pins:
      FAST_MATH: false
    knobs:
      REDUCE: coop
      WORK: t128
    identity: c00854e083a8e42e28c834c5f5dc7421a1fbde6fd239de2ad1bf03e889fac66e
