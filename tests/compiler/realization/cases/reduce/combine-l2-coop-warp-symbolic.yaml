# The same combine cell over a SYMBOLIC reduce axis: an Accum carrier under both a pre-map (square) and a projection epilogue (sqrt),
# partitioned as a single-warp __shfl_xor_sync butterfly (coop at a 32-thread block).
#
# The kernel carries the runtime extent as an argument and each lane strides to it, so
# the strided bound IS the masked tail — a lane starting past the extent folds the
# carrier identity. mean's divisor is the runtime extent too, resolved at launch.
#
# The case runs at the axis hint, 512. The test this replaces also ran the same kernel
# at 700 to straddle the tile; a case file cannot spell 'compile symbolic, run at some
# other size', so the off-hint sweep stays in Python.
