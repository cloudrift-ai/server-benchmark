# The carrier-generic cooperative combine at one cell of its matrix: a degenerate Accum carrier with
# a constant-scale projection (the 1/N divisor), partitioned as ILP composed with coop — 2 register
# accumulators, a register tree, then the warp butterfly.
#
# Every carrier folds through the SAME combine and differs only in its state, so one partition kind
# breaking on a carrier it was not tuned on is exactly what the matrix catches. The reduce axis is
# 1024 so the 128-thread row reaches the cross-warp tree.
compute_cap:
- 12
- 0
programs:
- inputs: [x]
  outputs: [mean]
  nodes:
  - id: x
    op: input
    outputs: [[x, f32, [4, 1024]]]
  - id: mean
    op: torch.mean
    attrs: {axis: 1}
    inputs: [x]
    outputs: [[mean, f32, [4, 1]]]
configs:
- program: 0
  target:
    origins:
    - mean
  realizations:
  - name: k_mean_f402e0.a48a23de33c7
    bindings: {}
    pins:
      FAST_MATH: false
    knobs:
      REDUCE: coop/r2
      WORK: t32
