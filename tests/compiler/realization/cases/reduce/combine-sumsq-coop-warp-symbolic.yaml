- inputs: [x]
  outputs: [sum_1]
  nodes:
  - id: x
    op: input
    outputs: [[x, f32, [4, {sym: seq_len, hint: 512}]]]
  - id: mul
    op: tensor.elementwise
    attrs: {op: {__elementwise__: multiply}}
    inputs: [x, x]
    outputs: [[mul, f32, [4, {sym: seq_len, hint: 512}]]]
  - id: sum_1
    op: tensor.reduce
    attrs: {op: {__elementwise__: sum}, axis: 1}
    inputs: [mul]
    outputs: [[sum_1, f32, [4, 1]]]
