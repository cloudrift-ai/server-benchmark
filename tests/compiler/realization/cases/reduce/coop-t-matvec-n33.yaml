# The transposed cooperative band on a k-major matvec: 32 lanes sweep the OUTPUT axis over a
# ceil(N/32) grid, here N=33.
#
# 32 does not divide the swept extent, so the last block's upper lanes overhang: they clamp-read the
# last valid column (an in-bounds duplicate sweep) and their store is guarded off. Without that
# contract the band is unreachable on this shape at all.
compute_cap:
- 12
- 0
programs:
- inputs: [x0, x1]
  outputs: [linear]
  nodes:
  - id: x0
    op: input
    outputs: [[x0, f32, [1, 256]]]
  - id: x1
    op: input
    outputs: [[x1, f32, [33, 256]]]
  - id: linear
    op: torch.linear
    attrs: {has_bias: false}
    inputs: [x0, x1]
    outputs: [[linear, f32, [1, 33]]]
configs:
- program: 0
  target:
    origins:
    - linear
  realizations:
  - name: k_linear_0f15bd.0c85abde035f
    bindings: {}
    pins:
      FAST_MATH: false
    knobs:
      WORK: t128
      REDUCE: coop-t
    identity: f7dc10653d4d8598e242a032f1c6cda21f9770b77ea92f3f6a105ad434e069be
