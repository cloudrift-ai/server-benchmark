# The transposed cooperative band on a k-major matvec: 32 lanes sweep the OUTPUT axis over a
# ceil(N/32) grid, here N=500.
#
# 32 does not divide the swept extent, so the last block's upper lanes overhang: they clamp-read the
# last valid column (an in-bounds duplicate sweep) and their store is guarded off. Without that
# contract the band is unreachable on this shape at all.
compute_cap:
- 12
- 0
programs:
- inputs: [x0, x1]
  outputs: [linear]
  nodes:
  - id: x0
    op: input
    outputs: [[x0, f32, [1, 256]]]
  - id: x1
    op: input
    outputs: [[x1, f32, [500, 256]]]
  - id: linear
    op: torch.linear
    attrs: {has_bias: false}
    inputs: [x0, x1]
    outputs: [[linear, f32, [1, 500]]]
configs:
- program: 0
  target:
    origins:
    - linear
  realizations:
  - name: k_linear_7ddd44.fdd34b80fe94
    bindings: {}
    pins:
      FAST_MATH: false
    knobs:
      WORK: t128
      REDUCE: coop-t
    identity: 3e3e5d7b1e904f1d35d2953b51bcaa65a80bacccd241213b305aa592cf61caf2
