# The transposed band sweeping a SYMBOLIC output axis. A symbolic extent always overhangs, so the
# guard bounds against the runtime extent and the upper lanes' stores are discarded at any size; the
# band used to need a static extent for want of that guard. Compiled and run at the axis hint — the
# on-and-off-block sweep over one kernel stays in Python.
#
# The row sum keeps its reduced axis here. Spelled without keepdim the target picks up the trailing
# squeeze, and the numpy reference cannot run a reshape whose output shape is symbolic — a limit of
# the reference, not of the band, which realizes identically either way.
compute_cap:
- 12
- 0
programs:
- inputs: [x]
  outputs: [sum_1]
  nodes:
  - id: x
    op: input
    outputs: [[x, f32, [{sym: rows, hint: 512}, 256]]]
  - id: sum_1
    op: tensor.reduce
    attrs: {op: {__elementwise__: sum}, axis: 1}
    inputs: [x]
    outputs: [[sum_1, f32, [{sym: rows, hint: 512}, 1]]]
configs:
- program: 0
  target:
    origins:
    - sum_1
  realizations:
  - name: k_sum_1_reduce.a6b26fb98eeb
    bindings: {}
    pins:
      FAST_MATH: false
    knobs:
      WORK: t128
      REDUCE: coop-t
