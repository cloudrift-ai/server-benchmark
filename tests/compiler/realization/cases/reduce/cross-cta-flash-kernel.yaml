# The carrier-generic cross-CTA split and finalize, one cell of its matrix. Carrier: the N-component
# twisted (m, l, O) split-KV — Flash-Decoding. Finalize: DEFERRED — the producer writes a partial
# workspace and a second __global__ combine kernel reads it back, with no atomicAdd.
#
# One REDUCE letter owns both halves — the split across 2 CTAs and which finalize folds them — so
# matmul, a plain reduce and flash all reach it through the same fork. The twisted carrier admits
# only the deferred kernel: its exp(Δm) rescale is not an atomicAdd.
#
# The split is realized by REPLACING the kernel, so no piece stamps the g2 it came from; the pin is
# read structurally. PLACE=fuse is an input pin, not part of the schedule row.
compute_cap:
- 12
- 0
programs:
- inputs: [x0, x1, x2]
  outputs: [scaled_dot_product_attention]
  nodes:
  - id: x0
    op: input
    outputs: [[x0, f32, [1, 4, 64, 32]]]
  - id: x1
    op: input
    outputs: [[x1, f32, [1, 4, 64, 32]]]
  - id: x2
    op: input
    outputs: [[x2, f32, [1, 4, 64, 32]]]
  - id: scaled_dot_product_attention
    op: torch.sdpa
    attrs: {is_causal: false, sliding_window: null, scale: null}
