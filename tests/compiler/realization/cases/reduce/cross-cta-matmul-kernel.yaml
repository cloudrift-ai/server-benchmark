# The carrier-generic cross-CTA split and finalize, one cell of its matrix. Carrier: a split-K
# matmul, the 1-component SEMIRING instantiation. Finalize: the DEFERRED finalize — the producer
# writes a partial workspace and a second __global__ combine kernel reads it back, with no
# atomicAdd.
#
# One REDUCE letter owns both halves — the split across 2 CTAs and which finalize folds them — so
# matmul, a plain reduce and flash all reach it through the same fork. The twisted carrier admits
# only the deferred kernel: its e^dm rescale is not an atomicAdd.
#
# The split is realized by REPLACING the kernel, so no piece stamps the g2 it came from; the pin is
# read structurally. PLACE=fuse is an input pin, not part of the schedule row.
compute_cap:
- 12
- 0
programs:
- inputs: [x0, x1]
  outputs: [matmul]
  nodes:
  - id: x0
    op: input
    outputs: [[x0, f32, [8, 1024]]]
  - id: x1
    op: input
    outputs: [[x1, f32, [1024, 16]]]
  - id: matmul
    op: torch.matmul
    attrs: {has_bias: false}
    inputs: [x0, x1]
    outputs: [[matmul, f32, [8, 16]]]
configs:
- program: 0
  target:
    origins:
    - matmul
  realizations:
  - name: k_matmul_45eb95.7f6f71959dde
    bindings: {}
    pins:
      FAST_MATH: false
      PLACE: fuse
    knobs:
      REDUCE: g2k
    identity: cc467f46e42b6e670e8c494c91dc57c650522d5afcf9bd0adad719ab5147105f
