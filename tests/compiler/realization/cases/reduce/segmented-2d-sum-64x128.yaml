- inputs: [x]
  outputs: [o]
  nodes:
  - id: x
    op: input
    outputs: [[x, f32, [64, 128]]]
  - id: o
    op: tensor.reduce
    attrs: {op: {__elementwise__: sum}, axis: -1}
    inputs: [x]
    outputs: [[o, f32, [64, 1]]]
configs:
- program: 0
  target:
    origins:
    - o
