# A split reduce whose carrier carries a projection epilogue — an Accum carrier under both a pre-map
# (square) and a projection epilogue (sqrt) — under the DEFERRED finalize — the producer writes a
# partial workspace and a.
#
# The atomic finalize projects each CTA's partition BEFORE the add, so it is correct only when the
# projection distributes over the add: mean's constant scale does, l2's sqrt does not. The deferred
# kernel projects once after the combine and is correct for either. The (l2, atomic) cell is refused
# outright with a message naming g<n>k, which is the right answer rather than a gap, so it stays a
# pytest.raises in Python.
compute_cap:
- 12
- 0
programs:
- inputs: [x]
  outputs: [sqrt]
  nodes:
  - id: x
    op: input
    outputs: [[x, f32, [4, 1024]]]
  - id: mul
    op: tensor.elementwise
    attrs: {op: {__elementwise__: multiply}}
    inputs: [x, x]
    outputs: [[mul, f32, [4, 1024]]]
  - id: sum_1
    op: tensor.reduce
    attrs: {op: {__elementwise__: sum}, axis: 1}
    inputs: [mul]
    outputs: [[sum_1, f32, [4, 1]]]
  - id: sqrt
    op: tensor.elementwise
    attrs: {op: {__elementwise__: sqrt}}
    inputs: [sum_1]
    outputs: [[sqrt, f32, [4, 1]]]
configs:
- program: 0
  target:
    origins:
    - mul
    - sqrt
    - sum_1
  realizations:
  - name: k_sqrt_reduce.5fb4f2c2eb26
    bindings: {}
    pins:
      FAST_MATH: false
      PLACE: fuse
    knobs:
      REDUCE: g2k
    identity: c00854e083a8e42e28c834c5f5dc7421a1fbde6fd239de2ad1bf03e889fac66e
