# projection distributes over the add: mean's constant scale does, l2's sqrt does not. The deferred
# kernel projects once after the combine and is correct for either. The (l2, atomic) cell is refused
# outright with a message naming g<n>k, which is the right answer rather than a gap, so it stays a
# pytest.raises in Python.
